<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seafloor "Deep" base tiles: MapLibre test</title>
<link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  /* The page behind the transparent tiles. Tan = no survey, never a made-up depth. */
  #note { position: absolute; left: 8px; bottom: 8px; z-index: 2; max-width: 34em; padding: 4px 8px;
          background: rgba(255,255,255,.85); border-radius: 3px; color: #222; }
  #note b { color: #8a1c1c; }
  #picker { position: absolute; right: 8px; top: 8px; z-index: 2; padding: 4px 8px; background: rgba(255,255,255,.85);
            border-radius: 3px; color: #222; }
</style>
</head>
<body>
<div id="map"></div>
<div id="picker"><label>Relief <select id="variant"></select></label>
  <div id="layers"><label><input type="checkbox" id="currents-on"> Surface currents (HF radar)</label></div></div>
<div id="note"><b>Research preview. Not for navigation.</b> Morro Bay 10 m survey; mixed vertical references.
  Tan = no survey. <span id="readout"></span></div>
<script src="/node_modules/pmtiles/dist/pmtiles.js"></script>
<script type="module">
// Test page for var/seafloor/tiles/morro-bay-seafloor-deep.pmtiles (scripts/build_bathy_tiles.py).
// Serve the repository root with range support: python research/scripts/map_style/serve_range.py 18771
// Then open /research/scripts/map_style/bathy-deep-test.html?view=canyons  (or nearshore, full).
// Options: tiles=<url of the archive>, bg=checker (checkerboard behind the tiles, to see transparency),
//          zoom=<z>&lon=<lon>&lat=<lat> (a free view; overrides view).
import * as maplibregl from '/node_modules/maplibre-gl/dist/maplibre-gl.mjs';
const {Protocol} = window.pmtiles;   // the bundled build; the ESM build needs a bundler for fflate

const q = new URLSearchParams(location.search);
// variant=base|mild|medium|strong picks the relief enhancement of scripts/build_bathy_tiles.py (MAPSTYLE-2);
// base is the MAPSTYLE-1 look. A dropdown in the corner switches it (it reloads with ?variant=...).
const VARIANTS = ['base', 'mild', 'medium', 'strong'];
const variant = VARIANTS.includes(q.get('variant')) ? q.get('variant') : 'base';
const archive = q.get('tiles') || '/var/seafloor/tiles/morro-bay-seafloor-deep' + (variant === 'base' ? '' : '-' + variant) + '.pmtiles';
const picker = document.getElementById('variant');
picker.innerHTML = VARIANTS.map((v) => `<option${v === variant ? ' selected' : ''}>${v}</option>`).join('');
if (q.get('picker') === 'off') document.getElementById('picker').hidden = true;   // clean screenshots
picker.onchange = () => { q.set('variant', picker.value); location.search = q.toString(); };
// lon/lat boxes (W, S, E, N) of the crops: the two that bathy.py of the map style study renders
// (columns/rows of the 10 m raster: canyons 0..8000 x 2800..10163; nearshore 7500..10800 x 3300..8300)
// and, for MAPSTYLE-2, `ridges`, a nearshore view where rock outcrops and ridges show.
const VIEWS = {
  canyons: [-121.9664, 34.9348, -121.0733, 35.6092],
  nearshore: [-121.1371, 35.1135, -120.7683, 35.5667],
  // 3 x 3 km of 15-90 m bottom west of Morro Bay with the most ridge-like curvature in the survey
  ridges: [-120.9300, 35.2650, -120.8940, 35.2930],
  full: [-121.95, 34.95, -120.55, 35.85],
};
const TAN = '#d9d2c0';   // the study's "no survey" colour

maplibregl.setWorkerUrl('/node_modules/maplibre-gl/dist/maplibre-gl-worker.mjs');
maplibregl.addProtocol('pmtiles', new Protocol().tile);

const layers = [{id: 'no-survey', type: 'background', paint: {'background-color': TAN}}];
if (q.get('bg') === 'checker') layers.length = 0;
layers.push({id: 'seafloor-deep', type: 'raster', source: 'deep', paint: {'raster-fade-duration': 0}});

const map = new maplibregl.Map({
  container: 'map', fadeDuration: 0, attributionControl: {compact: true}, renderWorldCopies: false,
  style: {version: 8, sources: {deep: {type: 'raster', url: 'pmtiles://' + new URL(archive, location.href).href, tileSize: 256}}, layers},
  bounds: VIEWS[q.get('view')] || VIEWS.full,
  fitBoundsOptions: {padding: 0, animate: false}, interactive: true, maxPitch: 0,
});
if (q.get('bg') === 'checker') {
  document.getElementById('map').style.background =
    'repeating-conic-gradient(#bbb 0% 25%, #eee 0% 50%) 0 0 / 16px 16px';
}
if (q.get('zoom')) map.jumpTo({zoom: +q.get('zoom'), center: [+q.get('lon'), +q.get('lat')]});
const readout = document.getElementById('readout');
const show = () => { readout.textContent = 'zoom ' + map.getZoom().toFixed(2); };
map.on('move', show);
map.on('idle', () => { show(); window.__idle = true; });
map.on('error', (e) => { window.__error = String(e.error && e.error.message || e.error); });
window.__map = map;

// MAPLAYER-CURRENT-1: surface currents (style "current 5": vorticity tint + streamlines) from real HF-radar data.
// Data: python research/scripts/map_style/fetch_hfr_currents.py --sector central-coast  ->  var/currents/hfr-central-coast-6km.json
// Options: currents=on|off (default on), current_data=<url of another sector's json>.
// The data time is always written in the note; if the file is missing the page says so and draws nothing.
import {addCurrents, freshnessText} from './currents-layer.js';
const box = document.getElementById('currents-on');
const note = document.getElementById('note');
const line = document.createElement('div');
note.appendChild(line);
const dataUrl = q.get('current_data') || '/var/currents/hfr-central-coast-6km.json';
let overlay = null;
const paintLine = () => {
  line.hidden = !box.checked;
};
map.on('load', async () => {
  try {
    const doc = await (await fetch(dataUrl)).json();
    overlay = addCurrents(map, doc, {visible: q.get('currents') !== 'off'});
    box.checked = q.get('currents') !== 'off';
    line.innerHTML = '<b>Surface currents, not for navigation.</b> ' + freshnessText(doc) + '. Near-surface flow only; '
      + 'colour = spin (red counter-clockwise, blue clockwise); lines follow the flow; no colour = no radar vector.';
    window.__currents = doc.sample_at;
  } catch (e) {
    line.textContent = 'Surface currents: data file not found (' + dataUrl + '). Run research/scripts/map_style/fetch_hfr_currents.py.';
    box.disabled = true;
    window.__error = String(e);
  }
  paintLine();
  window.__currentsReady = true;
});
box.onchange = () => { if (overlay) overlay.setVisible(box.checked); paintLine(); };
</script>
</body>
</html>

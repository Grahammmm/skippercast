<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seafloor "Deep" base tiles: MapLibre test</title>
<link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  /* The page behind the transparent tiles. Tan = no survey, never a made-up depth. */
  #note { position: absolute; left: 8px; bottom: 8px; z-index: 2; max-width: 34em; padding: 4px 8px;
          background: rgba(255,255,255,.85); border-radius: 3px; color: #222; }
  #note b { color: #8a1c1c; }
  /* Chlorophyll overlay (MAPLAYER-CHLR-1): toggle, data time and legend. */
  #chl { position: absolute; right: 8px; top: 8px; z-index: 2; width: 17em; padding: 6px 8px;
         background: rgba(255,255,255,.9); border-radius: 3px; color: #222; }
  #chl label { font-weight: 600; }
  #chl .time { margin-top: 3px; }
  #chl .stale { color: #8a1c1c; font-weight: 600; }
  #chl .bar { height: 10px; margin: 6px 0 2px; border-radius: 2px; }
  #chl .ticks { position: relative; height: 1.2em; font-size: 11px; }
  #chl .ticks span { position: absolute; transform: translateX(-50%); }
  #chl .fine { font-size: 11px; color: #444; margin-top: 2px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="note"><b>Research preview. Not for navigation.</b> Morro Bay 10 m survey; mixed vertical references.
  Tan = no survey. <span id="readout"></span></div>
<div id="chl" hidden>
  <label><input type="checkbox" id="chl-on" checked> Chlorophyll (satellite)</label>
  <div class="time" id="chl-time"></div>
  <div class="bar" id="chl-bar"></div>
  <div class="ticks" id="chl-ticks"></div>
  <div class="fine">mg/m<sup>3</sup>, log scale. Clear = no reading (cloud or land), not zero. Sea-surface estimate, ~4 km cells; <b>not for navigation</b>.</div>
</div>
<script src="/node_modules/pmtiles/dist/pmtiles.js"></script>
<script type="module">
// Test page for var/seafloor/tiles/morro-bay-seafloor-deep.pmtiles (scripts/build_bathy_tiles.py).
// Serve the repository root with range support: python research/scripts/map_style/serve_range.py 18771
// Then open /research/scripts/map_style/bathy-deep-test.html?view=canyons  (or nearshore, full).
// Options: tiles=<url of the archive>, bg=checker (checkerboard behind the tiles, to see transparency),
//          zoom=<z>&lon=<lon>&lat=<lat> (a free view; overrides view).
import * as maplibregl from '/node_modules/maplibre-gl/dist/maplibre-gl.mjs';
const {Protocol} = window.pmtiles;   // the bundled build; the ESM build needs a bundler for fflate

const q = new URLSearchParams(location.search);
const archive = q.get('tiles') || '/var/seafloor/tiles/morro-bay-seafloor-deep.pmtiles';
// lon/lat boxes (W, S, E, N) of the two crops that bathy.py of the map style study renders
// (columns/rows of the 10 m raster: canyons 0..8000 x 2800..10163; nearshore 7500..10800 x 3300..8300).
const VIEWS = {
  canyons: [-121.9664, 34.9348, -121.0733, 35.6092],
  nearshore: [-121.1371, 35.1135, -120.7683, 35.5667],
  full: [-121.95, 34.95, -120.55, 35.85],
};
const TAN = '#d9d2c0';   // the study's "no survey" colour

maplibregl.setWorkerUrl('/node_modules/maplibre-gl/dist/maplibre-gl-worker.mjs');
maplibregl.addProtocol('pmtiles', new Protocol().tile);

const layers = [{id: 'no-survey', type: 'background', paint: {'background-color': TAN}}];
if (q.get('bg') === 'checker') layers.length = 0;
layers.push({id: 'seafloor-deep', type: 'raster', source: 'deep', paint: {'raster-fade-duration': 0}});

// Chlorophyll overlay (MAPLAYER-CHLR-1): a private web-mercator image built by
// scripts/build_chlorophyll_layer.py into var/chlorophyll/<sector>/. Options: chl=off (start hidden),
// sector=<id> (default central-coast). The page shows the data's own time, never the load time.
const sources = {deep: {type: 'raster', url: 'pmtiles://' + new URL(archive, location.href).href, tileSize: 256}};
const sector = q.get('sector') || 'central-coast';
let chl = null;
try {
  const r = await fetch(`/var/chlorophyll/${sector}/chlorophyll.json`);
  if (r.ok) chl = await r.json();
} catch (e) { /* no layer built: the base still works */ }
if (chl) {
  const [w, s, e, n] = chl.bounds;
  sources.chlorophyll = {type: 'image', url: `/var/chlorophyll/${sector}/chlorophyll.png`, coordinates: [[w, n], [e, n], [e, s], [w, s]]};
  layers.push({id: 'chlorophyll', type: 'raster', source: 'chlorophyll',
               layout: {visibility: q.get('chl') === 'off' ? 'none' : 'visible'},
               paint: {'raster-fade-duration': 0, 'raster-resampling': 'linear', 'raster-opacity': 1}});
}

const map = new maplibregl.Map({
  container: 'map', fadeDuration: 0, attributionControl: {compact: true}, renderWorldCopies: false,
  style: {version: 8, sources, layers},
  bounds: VIEWS[q.get('view')] || VIEWS.full,
  fitBoundsOptions: {padding: 0, animate: false}, interactive: true, maxPitch: 0,
});
if (q.get('bg') === 'checker') {
  document.getElementById('map').style.background =
    'repeating-conic-gradient(#bbb 0% 25%, #eee 0% 50%) 0 0 / 16px 16px';
}
if (q.get('zoom')) map.jumpTo({zoom: +q.get('zoom'), center: [+q.get('lon'), +q.get('lat')]});
const readout = document.getElementById('readout');
const show = () => { readout.textContent = 'zoom ' + map.getZoom().toFixed(2); };
map.on('move', show);
map.on('idle', () => { show(); window.__idle = true; });
map.on('error', (e) => { window.__error = String(e.error && e.error.message || e.error); });
window.__map = map;

if (chl) {
  const panel = document.getElementById('chl');
  const on = document.getElementById('chl-on');
  panel.hidden = false;
  on.checked = q.get('chl') !== 'off';
  on.addEventListener('change', () => map.setLayoutProperty('chlorophyll', 'visibility', on.checked ? 'visible' : 'none'));
  const sample = new Date(chl.sample_at);
  const ageH = (Date.now() - sample.getTime()) / 3600e3;
  const when = sample.toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
  const days = ageH >= 48 ? Math.round(ageH / 24) + ' days' : Math.round(ageH) + ' h';
  const stale = ageH > chl.max_age_hours;
  const time = document.getElementById('chl-time');
  time.innerHTML = `Data time: <b>${when}</b> (${days} old)` +
    (stale ? `<div class="stale">Older than the app's ${chl.max_age_hours} h limit: stale.</div>` : '');
  const stops = chl.style.legend;
  document.getElementById('chl-bar').style.background =
    'linear-gradient(to right, ' + stops.map((x, i) => `${x[1]} ${(100 * i / (stops.length - 1)).toFixed(1)}%`).join(', ') + ')';
  const lo = Math.log10(chl.style.vmin), hi = Math.log10(chl.style.vmax);
  document.getElementById('chl-ticks').innerHTML = [0.1, 0.3, 1, 3, 10]
    .map(v => `<span style="left:${(100 * (Math.log10(v) - lo) / (hi - lo)).toFixed(1)}%">${v}</span>`).join('');
  window.__chl = chl;
}
</script>
</body>
</html>

name: Draft region evidence rehearsal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/draft-region-rehearsal.yml"
      - "scripts/refresh_regions.py"
      - "regions/**"
      - "jurisdictions/**"
      - "dist/data/regulations-*.json"

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        region_id: [bodega-point-reyes, fort-bragg-point-arena, crescent-city]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate draft and collect source evidence
        env:
          PYTHONPATH: src
          REGION_ID: ${{ matrix.region_id }}
        run: |
          python - <<'PY'
          import os
          from skippercast.platform.contracts import load_region
          region = load_region(os.environ['REGION_ID'])
          if region['status'] != 'draft':
              raise SystemExit('This workflow accepts draft regions only')
          print(region['id'], region['name'])
          PY
          python scripts/refresh_regions.py daily \
            --output "var/draft-rehearsal/${REGION_ID}" \
            --only-region "${REGION_ID}" --include-drafts
      - name: Report legal and source health
        if: always()
        env:
          REGION_ID: ${{ matrix.region_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          region = os.environ['REGION_ID']
          root = Path('var/draft-rehearsal') / region / 'regions' / region
          if not (root / 'latest.json').is_file():
              raise SystemExit('Draft collector produced no regional receipt')
          evidence = json.loads((root / 'latest.json').read_text())
          rules = json.loads((root / 'regulations-health.json').read_text())
          health = evidence['health']
          source_failures = [ident for ident in health['issues']
                             if evidence['sources'][ident]['status'] in ('failed', 'retained')]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"## {region} draft rehearsal\n")
              out.write(f"{health['sources_ok']}/{health['sources_total']} sources healthy; legal source changes or failures: {len(rules['review_required'])}; source fetch failures: {len(source_failures)}.\n")
              out.write('This is unpublished source evidence, not fishing permission or site clearance.\n')
              for issue in health['issues']:
                  out.write(f'- {issue}\n')
          if rules['review_required'] or source_failures or not health['critical_available']:
              raise SystemExit('Draft evidence needs review before regional promotion')
          PY
      - name: Upload unpublished evidence and health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-rehearsal-${{ matrix.region_id }}-${{ github.run_id }}
          path: var/draft-rehearsal/${{ matrix.region_id }}/
          if-no-files-found: warn
          retention-days: 14

name: Deploy to Cloudflare

# Deploys main to SkipperCast's Cloudflare account: always the workers.dev
# address, plus the hosts in the CUSTOM_DOMAINS repository variable (e.g.
# skippercast.com,www.skippercast.com) once that zone is on Cloudflare; see
# docs/cloudflare.md. Does nothing until the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets exist. CLOUDFLARE_SITE_URL names the host the
# smoke test checks (the custom domain once it is attached).
#
# Only a main commit that passed "Offline checks" is deployed, and exactly that
# commit. After deploying, the site is smoke-tested; a failure rolls the Worker
# back to the version that was live before the deploy (recorded by the deploy
# script) and checks the site no longer serves the failed build. D1 migrations are forward-only:
# the deploy script backs up the database first (docs/operations/runbooks/rollback-release.md).
on:
  workflow_run:
    workflows: ["Offline checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy the current main, or roll back to an earlier Worker version (see version)"
        type: choice
        options: [deploy, rollback]
        default: deploy
      version:
        description: "Worker version id to roll back to; empty picks the newest version from a different commit"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  WRANGLER: npx --yes wrangler@4.142.0

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI tested, not whatever main is by the time this runs.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Check deployment source-use policy before any deployment writes
        run: PYTHONPATH=src python3 -m skippercast.seafloor.rights
      - name: Build Worker and fingerprinted site
        run: |
          pnpm build
          node scripts/check_client.mjs
      - name: Require a smoke-test address before deploying
        env:
          SITE: ${{ vars.CLOUDFLARE_SITE_URL }}
        run: |
          # A deploy nobody smoke-tests can go green while the site is broken, so it fails here,
          # before anything is written. Unconfigured Cloudflare (no token or account) still deploys nothing.
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -z "$SITE" ]; then
            echo "::error::CLOUDFLARE_SITE_URL is unset, so this deploy could not be smoke-tested. Set the repository variable (docs/cloudflare.md)."
            exit 1
          fi
      - name: Back up D1, migrate and deploy
        id: deploy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Text Advisor phone-number key, uploaded as the Worker secret ADVISOR_PHONE_KEY. Named
          # SECRET_* here because ADVISOR_* names in this env are copied into plain vars.
          SECRET_ADVISOR_PHONE_KEY: ${{ secrets.ADVISOR_PHONE_KEY }}
          # Text Advisor Mac relay and its webhook path secret (runbook: advisor-relay-setup.md).
          SECRET_ADVISOR_WEBHOOK_TOKEN: ${{ secrets.ADVISOR_WEBHOOK_TOKEN }}
          BLUEBUBBLES_URL: ${{ secrets.BLUEBUBBLES_URL }}
          BLUEBUBBLES_PASSWORD: ${{ secrets.BLUEBUBBLES_PASSWORD }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # TA-C2: Twilio adapter (port-to-Twilio runbook); TWILIO_FROM only after a port.
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
          # TA-W4: the admin funnel's Analytics Engine SQL reads (the ops report's token; Account Analytics: Read).
          # Uploaded with CLOUDFLARE_ACCOUNT_ID (the job's env) only when set.
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          # TA-S0: Meta Graph API (Instagram and the Facebook Page); values from scripts/advisor/meta-token.mjs
          # (docs/plans/text-advisor/09-social.md § Setup). Uploaded as Worker secrets only when set.
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          # TA-V2: the Hermes vision provider (07-vision.md § Hand-off to Hermes); the chain skips Hermes while unset.
          HERMES_VISION_URL: ${{ secrets.HERMES_VISION_URL }}
          HERMES_VISION_TOKEN: ${{ secrets.HERMES_VISION_TOKEN }}
          # Web Push signing pair. Optional: when unset, the deploy keeps the pair in the private
          # backup bucket (secrets/vapid.json), generating it on the first run (runbook: secrets-rotation.md).
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          EXTRA_ORIGINS: ${{ vars.EXTRA_ORIGINS }}
          CUSTOM_DOMAINS: ${{ vars.CUSTOM_DOMAINS }}
          # "true" adds the trip-check queues (creates them if missing); docs/cloudflare.md.
          ENABLE_QUEUES: ${{ vars.ENABLE_QUEUES }}
          # "true" adds the Text Advisor's media bucket and queues (creates them if missing); docs/plans/text-advisor/.
          ENABLE_ADVISOR: ${{ vars.ENABLE_ADVISOR }}
          # Text Advisor runtime settings, copied into the Worker's vars only with ENABLE_ADVISOR;
          # unset means the default in server/advisor/settings.ts. TEXT_ADVISOR_ENABLED=true turns the advisor on.
          TEXT_ADVISOR_ENABLED: ${{ vars.TEXT_ADVISOR_ENABLED }}
          ADVISOR_CHANNEL: ${{ vars.ADVISOR_CHANNEL }}
          ADVISOR_REPLIES_ENABLED: ${{ vars.ADVISOR_REPLIES_ENABLED }}
          ADVISOR_SOCIAL_ENABLED: ${{ vars.ADVISOR_SOCIAL_ENABLED }}
          ADVISOR_INBOX_ENABLED: ${{ vars.ADVISOR_INBOX_ENABLED }}
          ADVISOR_NUMBER: ${{ vars.ADVISOR_NUMBER }}
          ADVISOR_PUBLIC_BASE: ${{ vars.ADVISOR_PUBLIC_BASE }}
          ADVISOR_REGION_DEFAULT: ${{ vars.ADVISOR_REGION_DEFAULT }}
          ADVISOR_MODEL: ${{ vars.ADVISOR_MODEL }}
          ADVISOR_VISION_MODEL: ${{ vars.ADVISOR_VISION_MODEL }}
          ADVISOR_VISION_PROVIDERS: ${{ vars.ADVISOR_VISION_PROVIDERS }}
          ADVISOR_DAILY_MESSAGES_PER_CONTACT: ${{ vars.ADVISOR_DAILY_MESSAGES_PER_CONTACT }}
          ADVISOR_DAILY_LLM_PER_CONTACT: ${{ vars.ADVISOR_DAILY_LLM_PER_CONTACT }}
          ADVISOR_GLOBAL_DAILY_LLM: ${{ vars.ADVISOR_GLOBAL_DAILY_LLM }}
          ADVISOR_GLOBAL_DAILY_VISION: ${{ vars.ADVISOR_GLOBAL_DAILY_VISION }}
          ADVISOR_DAILY_LLM_PER_IP: ${{ vars.ADVISOR_DAILY_LLM_PER_IP }}
          ADVISOR_GLOBAL_DAILY_LLM_WEB: ${{ vars.ADVISOR_GLOBAL_DAILY_LLM_WEB }}
          ADVISOR_GLOBAL_DAILY_COLD: ${{ vars.ADVISOR_GLOBAL_DAILY_COLD }}
          ADVISOR_AUTO_PUBLISH_AFTER: ${{ vars.ADVISOR_AUTO_PUBLISH_AFTER }}
          ADVISOR_ADMIN_CONTACT_ID: ${{ vars.ADVISOR_ADMIN_CONTACT_ID }}
          ADVISOR_INBOX_PUBLIC_REPLIES: ${{ vars.ADVISOR_INBOX_PUBLIC_REPLIES }}
          BLUEBUBBLES_PRIVATE_API: ${{ vars.BLUEBUBBLES_PRIVATE_API }}
          # Charter fleet runtime switches, copied into the Worker's vars whenever set (no bindings);
          # unset means off (server/fleet/settings.ts). docs/plans/charter-fleet/design.md § 16.
          FLEET_ENABLED: ${{ vars.FLEET_ENABLED }}
          FLEET_MAP_ENABLED: ${{ vars.FLEET_MAP_ENABLED }}
          # FE-84: coast snapshot sources served from SkipperCast's feeds (nearshore, water-quality, ocean, history),
          # copied whenever set; unset keeps all of them on the Fish Worker bridge. docs/coastal-service.md.
          COAST_FEEDS: ${{ vars.COAST_FEEDS }}
          # "true" binds the Analytics Engine dataset skippercast_events; docs/cloudflare.md#observability.
          ENABLE_ANALYTICS: ${{ vars.ENABLE_ANALYTICS }}
          # "false" turns off Workers Logs' per-request invocation log, whose message is the request URL
          # (the BlueBubbles webhook token is in its path); docs/legal/threat-model.md § 9.1.
          WORKERS_INVOCATION_LOGS: ${{ vars.WORKERS_INVOCATION_LOGS }}
        run: |
          mkdir -p var
          bash scripts/cloudflare_deploy.sh
      - name: Smoke-test the deployed site (/, /map, /coast and the APIs)
        id: smoke
        if: steps.deploy.outputs.deployed == 'true'
        env:
          SITE: ${{ vars.CLOUDFLARE_SITE_URL }}
        run: |
          if [ -z "$SITE" ]; then echo "::error::CLOUDFLARE_SITE_URL is unset, so the deploy was not smoke-tested."; exit 1; fi
          bash scripts/smoke_test.sh "$SITE"
      - name: Roll back after a failed smoke test
        if: failure() && steps.deploy.outputs.deployed == 'true'
        env:
          PREVIOUS: ${{ steps.deploy.outputs.previous_version }}
          FAILED_BUILD: ${{ steps.deploy.outputs.build }}
          SITE: ${{ vars.CLOUDFLARE_SITE_URL }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          if [ "$SMOKE" = "failure" ]; then reason="failed its smoke test"; else reason="failed after the Worker was deployed (the deploy step did not finish)"; fi
          # The version live before this deploy, not a bare `wrangler rollback`: the secrets
          # upload adds a second deployment, so Wrangler's default is this commit's own code (#568).
          if [ -z "$PREVIOUS" ]; then
            echo "::error::Deployment of ${GITHUB_SHA} ${reason} and was NOT rolled back: the version live before it was not recorded. Roll back by hand; see docs/operations/runbooks/rollback-release.md."
            exit 1
          fi
          node scripts/wrangler_config.mjs 00000000-0000-0000-0000-000000000000 skippercast-feeds wrangler.rollback.jsonc
          if ! $WRANGLER rollback "$PREVIOUS" --config wrangler.rollback.jsonc --yes --message "Smoke test or deploy failed for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"; then
            echo "::error::Deployment of ${GITHUB_SHA} ${reason} and the rollback to Worker version ${PREVIOUS} FAILED; roll back by hand (docs/operations/runbooks/rollback-release.md)."
            exit 1
          fi
          # Confirm by the version Cloudflare reports live, not by the build id: a commit that
          # changed no client files has the same build id as the version it replaced.
          mkdir -p var
          if ! $WRANGLER deployments list --json --config wrangler.rollback.jsonc > var/deployments.json; then
            echo "::error::Deployment of ${GITHUB_SHA} ${reason}; rollback reported success by Wrangler but the live version could not be confirmed. Check by hand; see docs/operations/runbooks/rollback-release.md."
            exit 1
          fi
          live=$(node scripts/worker_versions.mjs live var/deployments.json || true)
          if [ -z "$live" ]; then
            echo "::error::Deployment of ${GITHUB_SHA} ${reason}; the rollback to Worker version ${PREVIOUS} could not be confirmed: no live version found in Cloudflare's deployment list. Check by hand; see docs/operations/runbooks/rollback-release.md."
            exit 1
          fi
          if [ "$live" != "$PREVIOUS" ]; then
            echo "::error::Deployment of ${GITHUB_SHA} ${reason}; the rollback to Worker version ${PREVIOUS} did not take effect: Cloudflare reports version ${live} live. See docs/operations/runbooks/rollback-release.md."
            exit 1
          fi
          # The site's build id is only reported, never a reason to fail.
          served=""
          note=" (site build not checked: CLOUDFLARE_SITE_URL is unset)"
          if [ -n "$SITE" ]; then
            # Keep polling while the failed build is still served (edge caches lag), up to 6 tries 10 s apart.
            for attempt in 1 2 3 4 5 6; do
              served=$(curl -fsS --max-time 15 "$SITE/api/health" 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('build',''))" 2>/dev/null || true)
              if [ -n "$served" ] && [ "$served" != "$FAILED_BUILD" ]; then break; fi
              if [ "$attempt" -lt 6 ]; then sleep 10; fi
            done
            if [ -z "$served" ]; then
              note=" (/api/health did not answer; the Cloudflare side confirms the rollback)"
            elif [ -n "$FAILED_BUILD" ] && [ "$served" = "$FAILED_BUILD" ]; then
              note=" (the site still serves build ${FAILED_BUILD}, the failed deploy's build id; expected when that commit changed no client files)"
            else
              note=" (site serves build ${served})"
            fi
          fi
          echo "::error::Deployment of ${GITHUB_SHA} ${reason} and was rolled back to Worker version ${PREVIOUS}, now live${note}. D1 migrations, if any, were not reverted; see docs/operations/runbooks/rollback-release.md."
          exit 1

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Roll back to a Worker version from a different commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Not a bare `wrangler rollback`: after a normal deploy it lands on the live commit's
          # own code version, because the secrets upload made the newest deployment (#568).
          mkdir -p var
          node scripts/wrangler_config.mjs 00000000-0000-0000-0000-000000000000 skippercast-feeds wrangler.rollback.jsonc
          $WRANGLER deployments list --json --config wrangler.rollback.jsonc > var/deployments.json
          $WRANGLER versions list --json --config wrangler.rollback.jsonc > var/versions.json
          echo "Live Worker version: $(node scripts/worker_versions.mjs live var/deployments.json || echo unknown)"
          target=$VERSION
          if [ -z "$target" ]; then target=$(node scripts/worker_versions.mjs rollback-target var/deployments.json var/versions.json); fi
          commit=$(node scripts/worker_versions.mjs commit var/versions.json "$target" 2>/dev/null || echo "unknown")
          echo "Rolling back to Worker version $target (commit $commit)"
          $WRANGLER rollback "$target" --config wrangler.rollback.jsonc --yes --message "Manual rollback by ${GITHUB_ACTOR} (run ${GITHUB_RUN_ID})"
          if ! $WRANGLER deployments list --json --config wrangler.rollback.jsonc > var/deployments.json; then
            echo "::error::Rollback to ${target} reported success by Wrangler but the live version could not be confirmed."
            exit 1
          fi
          live=$(node scripts/worker_versions.mjs live var/deployments.json || true)
          if [ -z "$live" ]; then
            echo "::error::The rollback to Worker version ${target} could not be confirmed: no live version found in Cloudflare's deployment list. Check by hand; see docs/operations/runbooks/rollback-release.md."
            exit 1
          fi
          if [ "$live" != "$target" ]; then
            echo "::error::The rollback to Worker version ${target} did not take effect: Cloudflare reports version ${live} live. See docs/operations/runbooks/rollback-release.md."
            exit 1
          fi
          echo "Worker version ${live} is live."
      - name: Smoke-test after rollback
        env:
          SITE: ${{ vars.CLOUDFLARE_SITE_URL }}
        run: |
          if [ -z "$SITE" ]; then echo "::error::CLOUDFLARE_SITE_URL is unset, so the rollback was not smoke-tested."; exit 1; fi
          sleep 10
          # "" skips the build match: this job builds nothing, so dist/client is absent.
          bash scripts/smoke_test.sh "$SITE" ""

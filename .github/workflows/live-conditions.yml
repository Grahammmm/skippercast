name: Live regional conditions and trip alerts

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      check_trips:
        description: "Also run the saved-trip check job (always on unless the ENABLE_QUEUES variable is true)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/skippercast/pipeline/live.py"
      - "src/skippercast/pipeline/parsers.py"
      - "src/skippercast/pipeline/collect.py"
      - ".github/workflows/live-conditions.yml"
      - "regions/**"
      - "catalog/**"
      - "jurisdictions/**"
      - "src/skippercast/pipeline/settings.py"
      - "src/skippercast/platform/**"
      - "scripts/refresh_regions.py"
      - "scripts/prune_habitat_tiles.py"
      - "src/skippercast/pipeline/intelligence.py"
      - "src/skippercast/pipeline/ocean.py"
      - "src/skippercast/pipeline/verification.py"
      - "src/skippercast/pipeline/verification_archive.py"
      - "src/skippercast/pipeline/habitat_dynamics.py"
      - "src/skippercast/pipeline/wave_ensemble.py"
      - "scripts/check_saved_trips.py"
      - "scripts/trip_check_loop.py"
      - "scripts/run_core_tests.py"
      - "scripts/live_loop.py"
      - "scripts/live_cycle.sh"
      - "scripts/report_conditions.py"
      - "scripts/publish_forecasts.sh"
      - "scripts/model_api.mjs"
      - "server/model-api.js"
      - "src/skippercast/forecast/**"
      - "requirements-ocean.txt"
      - "deployments/**"

# Each job gets only what it needs. The OIDC token for private trip checks is
# issued to the notify job only; server/job-auth.ts pins this workflow file
# (workflow_ref), so the jobs stay in live-conditions.yml.
permissions: {}

concurrency:
  group: live-buoy-observations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write  # pushes the conditions and forecasts branches
    outputs:
      started: ${{ steps.start.outputs.started }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The forecast sampler shared with the Worker runs on Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ocean.txt
            requirements-survey.txt
      - name: Install reviewed ocean data decoders
        run: python -m pip install -r requirements-ocean.txt -r requirements-survey.txt -r requirements-publish.txt
      - name: Test the live conditions pipeline
        env:
          PYTHONPATH: src
        run: python scripts/run_core_tests.py --scope live
      - name: Record loop start
        id: start
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      # One job refreshes every 30 minutes for about 5.5 hours; pushes run one cycle.
      # Degraded individual sources are warnings; a failed cycle means no publication.
      # Trip checks run in the notify job, so a delivery failure cannot fail a cycle.
      - name: Refresh and publish every 30 minutes
        env:
          # R2_PUBLISH_TOKEN (R2 object read/write on the feed bucket only) is preferred;
          # the broad deploy token remains the fallback until the owner creates it.
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_PUBLISH_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEEDS_PUBLIC_BASE: ${{ vars.FEEDS_PUBLIC_BASE }}
        run: python scripts/live_loop.py --skip-trips ${{ github.event_name == 'push' && '--once' || '--budget-minutes 330' }}

  # Private saved-trip checks after each publication, beside the refresh job.
  # With the ENABLE_QUEUES repository variable set to "true", the Worker's cron
  # queues these checks itself (server/trip-queue.ts), so this job runs only when
  # dispatched by hand with check_trips; it remains the fallback path.
  notify:
    if: vars.ENABLE_QUEUES != 'true' || inputs.check_trips
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read   # watch the conditions branch head
      actions: read    # see when the refresh job has finished
      id-token: write  # short-lived identity for /api/jobs/check (server/job-auth.ts)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check saved trips after each publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/trip_check_loop.py ${{ github.event_name == 'push' && '--once --budget-minutes 60' || '--budget-minutes 345' }}

  # Scheduled runs are throttled by GitHub (they started only every 3-5 hours);
  # dispatched runs are not, so each loop starts its successor.
  next:
    needs: refresh
    if: always() && !cancelled() && github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # dispatch the next run of this workflow
    steps:
      - name: Start the next loop
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ needs.refresh.outputs.started }}
        run: |
          elapsed=$(( $(date +%s) - ${STARTED:-$(date +%s)} ))
          if [ "$elapsed" -lt 3600 ]; then
            echo "::warning::Loop ended after ${elapsed}s; not chaining so a fast failure cannot repeat. The schedule or freshness check will restart it."
            exit 0
          fi
          gh workflow run live-conditions.yml --ref main --repo "$GITHUB_REPOSITORY"

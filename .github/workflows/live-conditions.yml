name: Live buoy observations

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/skippercast/pipeline/live.py"
      - "src/skippercast/pipeline/parsers.py"
      - "src/skippercast/pipeline/collect.py"
      - ".github/workflows/live-conditions.yml"
      - "regions/**"
      - "catalog/**"
      - "jurisdictions/**"
      - "src/skippercast/pipeline/settings.py"
      - "src/skippercast/platform/**"
      - "scripts/refresh_regions.py"

permissions:
  contents: write

concurrency:
  group: live-buoy-observations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test observation parsing
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_pipeline*.py' -v
      - name: Load previous buoy feed
        run: |
          mkdir -p var/live
          if git ls-remote --exit-code --heads origin conditions >/dev/null; then
            git fetch origin conditions --depth=1
            git worktree add --detach var/live-published FETCH_HEAD
            cp var/live-published/latest.json var/live/previous.json
          fi
      - name: Collect current NOAA observations
        env:
          PYTHONPATH: src
        run: python scripts/refresh_regions.py live --output var/live --previous-root var/live-published
      - name: Publish the conditions feed
        run: |
          if [ ! -d var/live-published ]; then
            mkdir -p var/live-published
            git -C var/live-published init -b conditions
            git -C var/live-published remote add origin "$(git remote get-url origin)"
            git -C var/live-published config http.https://github.com/.extraheader "$(git config --get http.https://github.com/.extraheader)"
          fi
          cp var/live/latest.json var/live-published/
          mkdir -p var/live-published/regions
          cp -R var/live/regions/. var/live-published/regions/
          cp docs/live-conditions.md var/live-published/README.md
          git -C var/live-published config user.name 'github-actions[bot]'
          git -C var/live-published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C var/live-published add latest.json regions README.md
          git -C var/live-published commit -m 'Refresh NOAA buoy observations'
          git -C var/live-published push origin HEAD:refs/heads/conditions
      - name: Report source failures after publishing their status
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('var/live/latest.json').read_text())
          lines = ['## Buoy observations', 'Collected ' + data['completed_at']]
          for source in data['sources'].values():
              sample = (source.get('data') or {}).get('sample_at', 'unavailable')
              lines.append(f"- {source['name']}: {source['status']}; observed {sample}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(lines))
          regional = json.loads(Path('var/live/regions/index.json').read_text())
          if any(row['issues'] for row in regional['regions']):
              raise SystemExit('One or more regional buoy feeds are degraded; source states were published.')
          if data['health']['issues']:
              raise SystemExit('Buoy feed degraded: ' + ', '.join(data['health']['issues']))
          PY

name: Fleet AIS processor

# The charter fleet's AIS processor (CF-45; docs/plans/charter-fleet/design.md § 11):
# every 30 minutes on our own runner, next to the listener's raw store, it pushes the
# heartbeat and hourly counters, derives trips, segments, events and aggregates from
# the watched vessels' positions and replaces them through /api/fleet/jobs/* with a
# short-lived GitHub identity (server/routes/fleet.ts FLEET_JOB_SCOPE). A dispatch
# with `from` and `to` re-runs that window of departures only; one with `backfill_month`
# runs the MarineCadastre backfill (CF-47, § 11 and D9) for that month instead: NOAA's
# daily files into their own store, then the same processor, every row tagged
# noaa-planning-only. A scheduled run then copies labelled trips' raw positions to
# ais/validation/ (CF-48), out of retention's reach; a dispatch with `validate` scores the
# classifier against the hand labels and writes the aggregate report to the summary.
# A dispatch with `label_import` (N7) posts an agent's proposed labels, a file under
# FLEET_VAR on the runner, to /api/fleet/jobs/labels for the owner to approve.
# Raw positions never leave the runner. No pull_request trigger,
# so fork code never runs on Hermes.
on:
  schedule:
    # Keep both half-hour slots away from the start-of-hour scheduling peak.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Re-run window: first region-local day (YYYY-MM-DD); empty for a normal run"
        required: false
      to:
        description: "Re-run window: last region-local day, inclusive (YYYY-MM-DD)"
        required: false
      backfill_month:
        description: "MarineCadastre backfill: a region-local month (YYYY-MM); empty for a normal run"
        required: false
      validate:
        description: "Score the classifier against the hand labels (CF-48) instead of processing"
        type: boolean
        required: false
        default: false
      label_import:
        description: "Import agent-proposed labels (N7): a JSON file path relative to FLEET_VAR on the runner; runs alone"
        required: false

permissions: {}

concurrency:
  group: fleet-ais
  cancel-in-progress: false

jobs:
  process:
    # Dark until the fleet is switched on, and never on a GitHub-hosted runner (no raw store there).
    if: vars.ENABLE_FLEET == 'true' && vars.DATA_RUNNER != ''
    runs-on: ${{ vars.DATA_RUNNER || 'ubuntu-latest' }}
    # A backfill month streams about 30 NOAA day files of 240-320 MB each.
    timeout-minutes: ${{ inputs.backfill_month && 150 || 25 }}
    permissions:
      contents: read   # the checkout
      id-token: write  # short-lived identity for /api/fleet/jobs (server/job-auth.ts pins this workflow)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          # No pip cache: on the self-hosted data runner the save step tried to
          # upload the runner's whole ~/.cache/pip (17 GB) after every run and
          # hit the 25-minute job timeout, so the run shows as cancelled even
          # though processing had finished. The install takes about a second.
      - name: Install the fleet extra
        run: python -m pip install -e ".[fleet]"
      - name: Process AIS positions
        env:
          REGION: ${{ vars.FLEET_REGION || 'CA' }}
          WINDOW_FROM: ${{ inputs.from }}
          WINDOW_TO: ${{ inputs.to }}
          BACKFILL_MONTH: ${{ inputs.backfill_month }}
          VALIDATE: ${{ inputs.validate }}
          LABEL_IMPORT: ${{ inputs.label_import }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          fleet_run_kind=normal
          if [ -n "$LABEL_IMPORT" ]; then fleet_run_kind=label-import
          elif [ "$VALIDATE" = "true" ]; then fleet_run_kind=validation
          elif [ -n "$BACKFILL_MONTH" ]; then fleet_run_kind=backfill
          elif [ -n "$WINDOW_FROM$WINDOW_TO" ]; then fleet_run_kind=window
          fi
          printf 'AIS run kind=%s trigger=%s cron=%s source=%s\n' "$fleet_run_kind" \
            "${GITHUB_EVENT_NAME:-unknown}" "${SCHEDULE_CRON:-none}" "${GITHUB_SHA:-unknown}"
          # The raw store and processor state live outside any checkout (design.md § 4).
          export SKIPPERCAST_FLEET_VAR="${SKIPPERCAST_FLEET_VAR:-$HOME/.local/share/skippercast/fleet}"
          if [ -n "$LABEL_IMPORT" ]; then
            if [ -n "$WINDOW_FROM$WINDOW_TO$BACKFILL_MONTH" ] || [ "$VALIDATE" = "true" ]; then
              echo "::error::label_import runs alone: leave from, to, backfill_month and validate empty"; exit 2
            fi
            # A file the labelling session wrote under FLEET_VAR; never a path outside it.
            case "$LABEL_IMPORT" in
              /*|..|../*|*/..|*/../*) echo "::error::label_import takes a path relative to FLEET_VAR"; exit 2 ;;
            esac
            if [ ! -f "$SKIPPERCAST_FLEET_VAR/$LABEL_IMPORT" ]; then
              echo "::error::label_import: no such file under FLEET_VAR"; exit 2
            fi
            LABEL_IMPORT="$SKIPPERCAST_FLEET_VAR/$LABEL_IMPORT"
            python -m skippercast.fleet.ais label import "$LABEL_IMPORT"
            exit 0
          fi
          if [ "$VALIDATE" = "true" ]; then
            # Sync the labels and copies, then the report: aggregates only, no MMSI, trip or labeller id.
            python -m skippercast.fleet.ais validate --region "$REGION" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$BACKFILL_MONTH" ]; then
            if [ -n "$WINDOW_FROM" ] || [ -n "$WINDOW_TO" ]; then
              echo "::error::backfill_month runs alone: leave from and to empty"; exit 2
            fi
            if ! [[ "$BACKFILL_MONTH" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
              echo "::error::backfill_month takes YYYY-MM"; exit 2
            fi
            python -m skippercast.fleet.ais backfill --region "$REGION" --month "$BACKFILL_MONTH" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          args=(--region "$REGION")
          if [ -n "$WINDOW_FROM" ] || [ -n "$WINDOW_TO" ]; then
            args+=(--from "$WINDOW_FROM" --to "$WINDOW_TO")
          fi
          python -m skippercast.fleet.ais process "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$WINDOW_FROM" ]; then
            # Labelled trips' raw positions to ais/validation/, kept while their labels exist (CF-48).
            python -m skippercast.fleet.ais validate --region "$REGION" --sync-only
          fi

name: Live feed freshness

# Opens (or updates) a GitHub issue when the public conditions, daily data or a
# region's live feed stops refreshing, and another when a critical source (buoys,
# alerts, tides, forecast models) has served degraded data past its limit; closes
# each once it recovers. The run is red only when a feed is stale or every source
# of a critical kind in one feed is out; a partial outage keeps the issue current
# and stays green. Limits: catalog/feed-health.json. The live-conditions alarm-clock
# dispatches this hourly; the schedule is a fallback if that cycle stops.
on:
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: live-feed-freshness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ vars.DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      # The site that serves /feeds/ (falls back to the workers.dev host when unset).
      FEEDS_PUBLIC_BASE: ${{ vars.FEEDS_PUBLIC_BASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check the published feeds and their sources
        id: age
        run: |
          set +e
          # Exit bits: 1 = a feed is stale or unreadable, 2 = every source of a critical kind in a
          # feed is degraded too long. A partial outage (one buoy of several) exits 0 and is
          # reported through --report so its issue stays current.
          report="$RUNNER_TEMP/feed-health.json"
          rm -f "$report"  # the fail-closed fallback must never read an old report
          message="$(python scripts/check_feed_freshness.py --report "$report")"
          echo "$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          flag() {  # fail closed: a crash before the report counts as stale
            python -c 'import json,sys; print(str(json.load(open(sys.argv[1]))[sys.argv[2]]).lower())' "$report" "$1" 2>/dev/null \
              || { [ "$1" = stale ] && echo true || echo false; }
          }
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "message<<$delim"
            echo "$message"
            echo "$delim"
            echo "stale=$(flag stale)"
            echo "degraded=$(flag degraded)"
            echo "partial=$(flag partial)"
          } >> "$GITHUB_OUTPUT"
      # The live job chains itself every ~5.5 hours; if the chain broke, restart it
      # long before the 3-hour issue threshold.
      - name: Restart the live loop if the feed is over 75 minutes old
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python scripts/check_feed_freshness.py --live-only --max-age-hours 1.25; then
            running=$(gh run list --workflow live-conditions.yml --status in_progress --json databaseId --jq 'length')
            queued=$(gh run list --workflow live-conditions.yml --status queued --json databaseId --jq 'length')
            if [ "$running" = 0 ] && [ "$queued" = 0 ]; then
              gh workflow run live-conditions.yml --ref main
              echo "Restarted the live loop." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      # The issue steps never fail the job themselves, so a stale feed cannot skip the
      # degraded-source refresh; the last step decides the job's result.
      # One open issue whose body tracks the current report, so a long source outage
      # does not post a comment every hour. Partial outages keep it current too.
      - name: Open or refresh the degraded-source issue
        if: always() && (steps.age.outputs.degraded == 'true' || steps.age.outputs.partial == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.age.outputs.message }}
        run: |
          gh label create feed-source-degraded --color D93F0B --description "A critical feed source is serving old data" 2>/dev/null || true
          existing="$(gh issue list --label feed-source-degraded --state open --json number --jq '.[0].number')"
          runbook="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/operations/runbooks/feed-stale.md"
          body="$MESSAGE"$'\n\n'"Updated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"$'\n\n'"Runbook: $runbook"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --label feed-source-degraded --title "Critical feed source degraded" --body "$body"
          fi
      - name: Close the degraded-source issue after recovery
        if: always() && steps.age.outputs.stale == 'false' && steps.age.outputs.degraded == 'false' && steps.age.outputs.partial == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.age.outputs.message }}
        run: |
          for number in $(gh issue list --label feed-source-degraded --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Recovered. $MESSAGE"
          done
      # One issue per stale feed per staleness event (scripts/feed_stale_alert.py): opened once with the feed name,
      # its last successful publish and how late it is, then one `still: N h` comment every 6 h while it stays
      # stale (not a comment every hour), closed when the feed publishes again. Lands in the repo's GitHub
      # notifications (owner and watchers). Replaces the old comment-every-hour and close-all steps.
      - name: Alert once per stale feed, age it, close on recovery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create feed-stale --color B60205 --description "A published feed stopped refreshing" 2>/dev/null || true
          python scripts/feed_stale_alert.py --report "$RUNNER_TEMP/feed-health.json" --stale "${{ steps.age.outputs.stale || 'true' }}"
      # Does the site itself answer? One `site-down` issue per outage (scripts/site_uptime_alert.py); a down site never
      # fails the job (the issue is the signal), only a crash of the probe does.
      - name: Probe the site and alert once when it is down
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create site-down --color B60205 --description "The site or /api/health stopped answering" 2>/dev/null || true
          python scripts/site_uptime_alert.py --base "${FEEDS_PUBLIC_BASE:-https://skippercast.g4651.workers.dev}" --report "$RUNNER_TEMP/site-uptime.json"
      # The coast data paths are proxied from a second ("Fish") Worker that nothing else here reaches. On 2026-11-12 the
      # reviewed-habitat release answered 503 for hours with every other check green. One `coast-data-down` issue per outage.
      - name: Probe the coast data paths and alert once when one is down
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create coast-data-down --color B60205 --description "A coast data path stopped answering" 2>/dev/null || true
          python scripts/site_uptime_alert.py --base "${FEEDS_PUBLIC_BASE:-https://skippercast.g4651.workers.dev}" --report "$RUNNER_TEMP/coast-data.json" \
            --paths /api/coast/habitat/release /api/coast/report /api/coast/ocean \
            --label coast-data-down --title "Coast data path is down" --subject "the coast data service"
      # Run the app's rules logic for all six Stage 1 regions. Keep one aggregate
      # issue open if ANY species lacks a status or ANY probe crashes; one healthy
      # region must never close an alert for a different, unhealthy region.
      # Install/probe failures count as missing status (fail safe), not job failure.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        continue-on-error: true
        with:
          node-version: "22"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
        with:
          version: 10
          # Per-job install dir: concurrent runner instances on one host share $HOME.
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install locked web dependencies for the rules probe
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - name: Probe the rules card and alert once when it is blank
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh label create rules-card-blank --color B60205 --description "A beta-region species has no season status, or its probe failed" 2>/dev/null || true
          # Collect every region before touching the shared issue. Only all-green recovers.
          code=0
          out=""
          for region in morro-bay cambria-san-simeon south-big-sur-san-simeon big-sur-coast monterey-point-sur point-arguello-conception; do
            result="$(node scripts/rules_status_probe.mjs --region "$region" --base "${FEEDS_PUBLIC_BASE:-https://skippercast.g4651.workers.dev}" 2>&1)"
            status=$?
            if [ "$status" != 0 ]; then code=1; fi
            out+="$region (probe exit $status)"$'\n'"$result"$'\n\n'
          done
          echo "$out"
          { echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          existing="$(gh issue list --label rules-card-blank --state open --json number --jq '.[0].number')"
          listed=$?  # a failed list must not open a duplicate
          if [ "$code" = 0 ]; then
            for number in $(gh issue list --label rules-card-blank --state open --json number --jq '.[].number'); do
              gh issue close "$number" --comment "Recovered: every species in all six Stage 1 regions has a season status again. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            done
          elif [ "$listed" = 0 ]; then
            body="At least one species in a Stage 1 region reads \"Check rules\", or a region's probe could not run. Per-region results follow."$'\n\n'"$out"$'\n\n'"Updated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. One issue per event: it closes only when every species in all six regions has a season status again (rules review, then approval)."
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body "$body"
            else
              gh issue create --label rules-card-blank --title "Rules status missing in a beta region" --body "$body"
            fi
          fi
          exit 0
      # Red only for a stale feed or a whole critical kind out; a partial outage stays green.
      - name: Fail when a feed is stale or a critical kind is out
        if: always() && (steps.age.outputs.stale == 'true' || steps.age.outputs.degraded == 'true')
        env:
          STALE: ${{ steps.age.outputs.stale }}
          DEGRADED: ${{ steps.age.outputs.degraded }}
        run: |
          echo "::error title=Feed freshness::stale=$STALE degraded=$DEGRADED (see the step summary)"
          exit 1

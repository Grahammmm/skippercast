name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  # Bot pull requests opened with GITHUB_TOKEN (seafloor.yml) dispatch this run.
  workflow_dispatch:

# PRs get one full check suite; obsolete PR revisions should not fill the queue.
# Main and manually dispatched bot-PR checks are never interrupted here.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  survey-science:
    # Self-hosted CI is opt-in only after its complete setup is verified.
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-survey.txt
            requirements-ocean.txt
            requirements-publish.txt
            requirements-test.txt
      # Everything the suite imports, so the full run can require zero unexpected skips.
      - name: Install the package, pinned native survey tools, ocean decoders and test tools
        run: python -m pip install -e . -r requirements-survey.txt -r requirements-ocean.txt -r requirements-publish.txt -r requirements-test.txt
      - name: Rebuild and validate species search footprints
        run: |
          python scripts/build_search_plans.py
          python -m pytest tests/gis/test_search_plan_geometry.py
      - name: Committed search plans match their sources
        run: |
          if ! git diff --quiet; then
            echo "::error::Rebuilt search plans differ from the commit. Run 'python scripts/build_search_plans.py' and commit the result; do not edit dist/ by hand."
            git diff --stat
            exit 1
          fi
      - name: Full Python suite (every layer, GIS required)
        env:
          SKIPPERCAST_REQUIRE_GIS: "1"
        # JUnit goes outside the checkout, so no report file can end up in a repository scan.
        run: python -m pytest --durations=15 --junitxml="$RUNNER_TEMP/pytest-survey.xml"
      - name: Test summary; fail on any skip outside the private-cache allowlist
        if: always()
        run: |
          junit="$RUNNER_TEMP/pytest-survey.xml"
          if [ ! -f "$junit" ]; then echo "::error::pytest wrote no JUnit report"; exit 1; fi
          python scripts/pytest_report.py "$junit" --title "Python, full suite (survey-science)" --strict-skips >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-survey
          path: ${{ runner.temp }}/pytest-survey.xml
          if-no-files-found: ignore
          retention-days: 14
  e2e:
    # Browser tests (P4-09a): Playwright + axe against the built site under
    # `wrangler dev` (e2e/serve.mjs), at 390x844 and 1280x800.
    # Self-hosted CI is opt-in only after its complete setup is verified.
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
          # Per-job install dir: concurrent runner instances on one host share
          # $HOME, and the default ~/setup-pnpm races.
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Worker and public assets
        run: pnpm build
      - name: Install Playwright's Chromium (with system libraries on GitHub-hosted runners)
        if: runner.environment == 'github-hosted'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright's Chromium (self-hosted; the host already has its libraries)
        if: runner.environment != 'github-hosted'
        run: pnpm exec playwright install chromium
      - name: Browser flows and accessibility (serious and critical axe violations fail)
        run: pnpm e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
  check:
    # Self-hosted CI is opt-in only after its complete setup is verified.
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Package installs and imports outside the checkout
        run: |
          python -m pip install -e .
          cd /tmp && python -c "import skippercast, skippercast.platform.contracts; print(skippercast.__version__)"
      - name: Install test tools
        run: python -m pip install -r requirements-test.txt
      # No survey/GIS packages here: the gis/ test directories run in survey-science.
      # Unit, contract, integration and claims tests run on both Pythons.
      - name: Python tests without GIS packages
        run: python -m pytest -m "not gis" --durations=15 --junitxml="$RUNNER_TEMP/pytest-core.xml"
      - name: Test summary
        if: always()
        run: |
          junit="$RUNNER_TEMP/pytest-core.xml"
          if [ ! -f "$junit" ]; then echo "::error::pytest wrote no JUnit report"; exit 1; fi
          python scripts/pytest_report.py "$junit" --title "Python ${{ matrix.python }}, no GIS packages" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-core-${{ matrix.python }}
          path: ${{ runner.temp }}/pytest-core.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Offline demonstration
        env:
          PYTHONPATH: src
        run: python -m skippercast demo
      - name: Rebuild regional contracts
        env:
          PYTHONPATH: src
        run: python -m skippercast.platform.build
      - name: Committed contracts match their sources
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files differ from the commit. Edit the source (regions/, catalog/, src/) and rerun 'python -m skippercast.platform.build' instead of editing dist/ by hand."
            git diff --stat
            exit 1
          fi
      - name: Documentation and publication checks
        run: python scripts/check_repository.py
      - name: Lint Python (syntax errors and undefined names)
        run: |
          python -m pip install ruff==0.16.9
          ruff check src
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
          # Per-job install dir: concurrent runner instances on one host share
          # $HOME, and the default ~/setup-pnpm races.
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check the Worker (tsc --noEmit, strict)
        run: pnpm typecheck
      - name: Forecast handling and GPX checks
        run: node --test tests/test_*.mjs
      - name: Design token contrast (WCAG 4.5:1, light and dark)
        run: node scripts/check_contrast.mjs --verbose
      # Guide 5.8: no two "not" sentences in a row, and no GFS/ECMWF/MLLW/datum
      # outside a disclosure. Existing copy is in scripts/copy-lint-baseline.json,
      # which may only shrink relative to the base branch.
      - name: Copy lint (baseline only shrinks)
        # Compare with what this change started from: the PR's base commit, or
        # the branch's previous tip on push. Never the current tip of main, which
        # may have shrunk the baseline since this branch was cut.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            node scripts/check_copy.mjs
          elif git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            node scripts/check_copy.mjs --base FETCH_HEAD
          else
            echo "::notice title=Copy lint::base commit $BASE_SHA is not fetchable (force-push); skipped the growth check"
            node scripts/check_copy.mjs
          fi
      # Design § 5: web/ reads colour and type from web/tokens.css; the baseline
      # (scripts/token-lint-baseline.json) may only shrink relative to the base.
      - name: Token lint (baseline only shrinks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ] && git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            node scripts/check_tokens.mjs --base FETCH_HEAD
          else
            node scripts/check_tokens.mjs
          fi
      - name: Website assets and data consistency
        run: python scripts/check_web.py
      - name: Build Worker and public assets
        run: pnpm build
      - name: Every published script, style and page is fingerprinted and resolves
        run: node scripts/check_client.mjs
      - name: Production dependencies have no high or critical advisories
        if: matrix.python == '3.13'
        run: pnpm audit --prod --audit-level high

name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  # Merge queue: required checks must also report on the queued merge commit.
  merge_group:
    types: [checks_requested]
  # Nightly full tier (CI policy R12): the slow suites also run on main pushes.
  schedule:
    - cron: "0 9 * * *"
  # Bot pull requests opened with GITHUB_TOKEN (seafloor.yml) dispatch this run.
  workflow_dispatch:

# CI policy R12 (fast PR tier). Pull requests run lint/type checks, the core
# affected core/web areas on 3.12 and affected GIS without three slow coast modules.
# Push to main, the merge queue, the nightly schedule and dispatches run the
# full tier: the full GIS-required suite, the Python matrix and e2e.
# Obsolete PR revisions are cancelled; main, scheduled and dispatched runs never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Conservative shared-data/unknown fallback; explicit area omissions only.
  # Rename/delete paths are included. Non-PR events select the full tier.
  changes:
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      survey: ${{ steps.filter.outputs.survey }}
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Synthetic merge commit and first parent give the complete PR diff.
          fetch-depth: 2
      - name: Affected-area fixtures
        run: python3 scripts/ci_select.py --fixtures
      - name: Classify changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: python3 scripts/ci_select.py
  # Required check (branch protection requires the `survey-science` context).
  # It always reports and passes only when `check` passed on every Python and
  # `survey-tests` passed, or a successful PR selector explicitly omitted GIS.
  # Missing/failed/cancelled prerequisites are non-success, not defect auto-fixes.
  survey-science:
    needs: [changes, survey-tests, check]
    if: always()
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Core suite and GIS layer passed
        env:
          EVENT: ${{ github.event_name }}
          GATE: ${{ needs.changes.result }}
          CORE: ${{ needs.changes.outputs.core }}
          WEB: ${{ needs.changes.outputs.web }}
          SURVEY: ${{ needs.changes.outputs.survey }}
          TESTS: ${{ needs.survey-tests.result }}
          CHECK: ${{ needs.check.result }}
        run: python3 scripts/ci_select.py --gate
  survey-tests:
    # On a pull request it runs the GIS layer when the gate says the change can
    # reach it; a website-only pull request skips it. The full suite runs on
    # main, merge queue, nightly and dispatch. `survey-science` gates on it.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.survey == 'true') }}
    # Self-hosted CI is opt-in only after its complete setup is verified. Fork PRs
    # and Dependabot PRs always stay on GitHub-hosted runners (docs/operations/runners.md).
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.CI_RUNNER || 'ubuntu-latest' }}
    # Pull requests keep one `pr` leg. The full tier runs as parallel parts: the two
    # slowest coast modules alone, everything else in `rest` (AUD-SC7). The gate
    # reads the aggregate result, which is success only when every leg passes.
    strategy:
      fail-fast: false
      matrix:
        part: ${{ github.event_name == 'pull_request' && fromJSON('["pr"]') || fromJSON('["close-safety", "segment-close", "rest"]') }}
    env:
      REPORT: ${{ matrix.part == 'pr' && 'pytest-survey' || format('pytest-survey-{0}', matrix.part) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ github.event_name == 'pull_request' && '3.12' || '3.13' }}
          cache: pip
          cache-dependency-path: |
            requirements-survey.txt
            requirements-ocean.txt
            requirements-publish.txt
            requirements-test.txt
      # Everything the suite imports, so the full run can require zero unexpected skips.
      - name: Install the package, pinned native survey tools, ocean decoders and test tools
        run: python -m pip install -e . -r requirements-survey.txt -r requirements-ocean.txt -r requirements-publish.txt -r requirements-test.txt
      - name: Rebuild and validate species search footprints
        # Geometry tests already belong to the selected GIS suite below.
        if: matrix.part == 'pr' || matrix.part == 'rest'
        run: python scripts/build_search_plans.py
      - name: Committed search plans match their sources
        if: matrix.part == 'pr' || matrix.part == 'rest'
        run: |
          if ! git diff --quiet; then
            echo "::error::Rebuilt search plans differ from the commit. Run 'python scripts/build_search_plans.py' and commit the result; do not edit dist/ by hand."
            git diff --stat
            exit 1
          fi
      - name: Full Python suite, part ${{ matrix.part }} (every layer, GIS required)
        if: github.event_name != 'pull_request'
        env:
          SKIPPERCAST_REQUIRE_GIS: "1"
          PART: ${{ matrix.part }}
        # JUnit goes outside the checkout, so no report file can end up in a repository scan.
        # `rest` ignores exactly the files the other parts run, so a new test file lands in it.
        run: |
          case "$PART" in
            close-safety) args="tests/gis/test_coast_close_safety.py" ;;
            segment-close) args="tests/gis/test_coast_segment_close.py" ;;
            rest) args="--ignore=tests/gis/test_coast_close_safety.py --ignore=tests/gis/test_coast_segment_close.py" ;;
            *) echo "::error::Unknown full-suite part '$PART'"; exit 1 ;;
          esac
          python -m pytest --durations=15 --junitxml="$RUNNER_TEMP/$REPORT.xml" $args
      # PR tier: the core layers already run in `check`, and three coast modules take
      # about 30 of the full suite's 40 minutes; they run on main and nightly.
      - name: GIS layer, slow coast modules excluded (pull request tier)
        if: github.event_name == 'pull_request'
        env:
          SKIPPERCAST_REQUIRE_GIS: "1"
        run: >-
          python -m pytest -m gis -n 4 --dist load --durations=15 --junitxml="$RUNNER_TEMP/$REPORT.xml"
          --ignore=tests/gis/test_coast_close_safety.py
          --ignore=tests/gis/test_coast_segment_close.py
          --ignore=tests/gis/test_coast_sign_off_graph.py
      - name: Test summary; fail on any skip outside the private-cache allowlist
        if: always()
        env:
          TITLE: ${{ github.event_name == 'pull_request' && 'Python, GIS layer, PR tier (survey-science)' || format('Python, full suite part {0} (survey-science)', matrix.part) }}
        run: |
          junit="$RUNNER_TEMP/$REPORT.xml"
          if [ ! -f "$junit" ]; then echo "::error::pytest wrote no JUnit report"; exit 1; fi
          python scripts/pytest_report.py "$junit" --title "$TITLE" --strict-skips >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.REPORT }}
          path: ${{ runner.temp }}/${{ env.REPORT }}.xml
          if-no-files-found: ignore
          retention-days: 14
  e2e:
    # Browser tests (P4-09a): Playwright + axe against the built site under
    # `wrangler dev` (e2e/serve.mjs), at 390x844 and 1280x800.
    # Full tier only (R12): main, merge queue, nightly and dispatch, not pull requests.
    if: github.event_name != 'pull_request'
    # Self-hosted CI is opt-in only after its complete setup is verified. Fork PRs
    # and Dependabot PRs always stay on GitHub-hosted runners (docs/operations/runners.md).
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          # Per-job install dir: concurrent runner instances on one host share
          # $HOME, and the default ~/setup-pnpm races.
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Worker and public assets
        run: pnpm build
      - name: Install Playwright's Chromium (with system libraries on GitHub-hosted runners)
        if: runner.environment == 'github-hosted'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright's Chromium (self-hosted; the host already has its libraries)
        if: runner.environment != 'github-hosted'
        run: pnpm exec playwright install chromium
      - name: Browser flows and accessibility (serious and critical axe violations fail)
        run: pnpm e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
  check:
    needs: changes
    # A broken selector runs conservative tests, but cannot pass the final gate.
    if: ${{ !cancelled() }}
    # Self-hosted CI is opt-in only after its complete setup is verified. Fork PRs
    # and Dependabot PRs always stay on GitHub-hosted runners (docs/operations/runners.md).
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        # One Python on pull requests (R12); the matrix runs in the full tier.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.11", "3.13"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Package installs and imports outside the checkout
        run: |
          python -m pip install -e .
          cd /tmp && python -c "import skippercast, skippercast.platform.contracts; print(skippercast.__version__)"
      # e2e runs on main only (R12); its reviewed-source hash pins are guarded on every PR here.
      - name: e2e reviewed-source pin guard
        run: python scripts/check_e2e_pins.py
      - name: Install test tools
        run: python -m pip install -r requirements-test.txt
      # No survey/GIS packages here: the gis/ test directories run in survey-science.
      # Unit, contract, integration and claims tests run on both Pythons.
      - name: Python tests without GIS packages
        if: needs.changes.outputs.core != 'false'
        run: python -m pytest -m "not gis" -n 4 --dist load --durations=15 --junitxml="$RUNNER_TEMP/pytest-core.xml"
      - name: Test summary
        if: always() && needs.changes.outputs.core != 'false'
        run: |
          junit="$RUNNER_TEMP/pytest-core.xml"
          if [ ! -f "$junit" ]; then echo "::error::pytest wrote no JUnit report"; exit 1; fi
          python scripts/pytest_report.py "$junit" --title "Python ${{ matrix.python }}, no GIS packages" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JUnit results
        if: always() && needs.changes.outputs.core != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-core-${{ matrix.python }}
          path: ${{ runner.temp }}/pytest-core.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Offline demonstration
        env:
          PYTHONPATH: src
        run: python -m skippercast demo
      - name: Rebuild regional contracts
        env:
          PYTHONPATH: src
        run: python -m skippercast.platform.build
      - name: Committed contracts match their sources
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files differ from the commit. Edit the source (regions/, catalog/, src/) and rerun 'python -m skippercast.platform.build' instead of editing dist/ by hand."
            git diff --stat
            exit 1
          fi
      - name: Documentation and publication checks
        run: python scripts/check_repository.py
      - name: Lint Python (syntax errors and undefined names)
        run: |
          python -m pip install ruff==0.16.10
          ruff check src
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          # Per-job install dir: concurrent runner instances on one host share
          # $HOME, and the default ~/setup-pnpm races.
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check the Worker (tsc --noEmit, strict)
        run: pnpm typecheck
      - name: Forecast handling and GPX checks
        if: needs.changes.outputs.web != 'false'
        run: |
          # Keep the explicitly pinned contrast gate below, but run it only once.
          files=()
          for path in tests/test_*.mjs; do
            if [ "$path" != tests/test_contrast_ci_adoption.mjs ]; then files+=("$path"); fi
          done
          node --test "${files[@]}"
      - name: Design token contrast (WCAG 4.5:1, light and dark)
        run: node --test tests/test_contrast_ci_adoption.mjs
        if: needs.changes.outputs.web != 'false'
      # Guide 5.8: no two "not" sentences in a row, and no GFS/ECMWF/MLLW/datum
      # outside a disclosure. Existing copy is in scripts/copy-lint-baseline.json,
      # which may only shrink relative to the base branch.
      - name: Copy lint (baseline only shrinks)
        # Compare with what this change started from: the PR's base commit, or
        # the branch's previous tip on push. Never the current tip of main, which
        # may have shrunk the baseline since this branch was cut.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            node scripts/check_copy.mjs
          elif git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            node scripts/check_copy.mjs --base FETCH_HEAD
          else
            echo "::notice title=Copy lint::base commit $BASE_SHA is not fetchable (force-push); skipped the growth check"
            node scripts/check_copy.mjs
          fi
      # Design § 5: web/ reads colour and type from web/tokens.css; the baseline
      # (scripts/token-lint-baseline.json) may only shrink relative to the base.
      - name: Token lint (baseline only shrinks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ] && git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            node scripts/check_tokens.mjs --base FETCH_HEAD
          else
            node scripts/check_tokens.mjs
          fi
      - name: Website assets and data consistency
        run: python scripts/check_web.py
      - name: Build Worker and public assets
        run: pnpm build
      - name: Every published script, style and page is fingerprinted and resolves
        run: node scripts/check_client.mjs
      - name: Production dependencies have no high or critical advisories
        # Not on PRs: new advisories fail it for reasons unrelated to the change.
        if: matrix.python == '3.13' && github.event_name != 'pull_request'
        run: pnpm audit --prod --audit-level high

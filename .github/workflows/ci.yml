name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  # Bot pull requests opened with GITHUB_TOKEN (seafloor.yml) dispatch this run.
  workflow_dispatch:

# Only PR revisions replace one another. Include workflow/event/ref so unrelated
# work stays independent; preserve every main/manual run (including pending ones).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      python: ${{ steps.plan.outputs.python }}
      survey: ${{ steps.plan.outputs.survey }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select suites conservatively (unknown paths run everything)
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_plan.py

  survey-shard:
    needs: changes
    if: needs.changes.outputs.survey == 'true'
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-survey.txt
            requirements-ocean.txt
            requirements-publish.txt
            requirements-test.txt
      - name: Install the package, pinned native survey tools, ocean decoders and test tools
        run: python -m pip install -e . -r requirements-survey.txt -r requirements-ocean.txt -r requirements-publish.txt -r requirements-test.txt
      - name: Rebuild and validate species search footprints
        if: matrix.shard == 1
        run: |
          python scripts/build_search_plans.py
          python -m pytest tests/gis/test_search_plan_geometry.py
      - name: Committed search plans match their sources
        if: matrix.shard == 1
        run: |
          if ! git diff --quiet; then
            echo "::error::Rebuilt search plans differ from the commit. Run 'python scripts/build_search_plans.py' and commit the result; do not edit dist/ by hand."
            git diff --stat
            exit 1
          fi
      - name: Full Python suite partition (every layer, GIS required)
        env:
          SKIPPERCAST_REQUIRE_GIS: "1"
        run: python scripts/ci_survey.py run --shard ${{ matrix.shard }} --count 4 --output "$RUNNER_TEMP/survey-${{ matrix.shard }}"
      - name: Test summary; fail on any skip outside the private-cache allowlist
        if: always()
        run: |
          junit="$RUNNER_TEMP/survey-${{ matrix.shard }}/pytest-survey.xml"
          if [ ! -f "$junit" ]; then echo "::error::pytest wrote no JUnit report"; exit 1; fi
          python scripts/pytest_report.py "$junit" --title "Python full suite, shard ${{ matrix.shard }}/4" --strict-skips >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JUnit results and exact collection receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-survey-${{ matrix.shard }}
          path: ${{ runner.temp }}/survey-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  e2e-tests:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    # Unchanged browser flows, both phone and laptop projects, and axe thresholds.
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate the browser cache on shared hosts
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Worker and public assets
        run: pnpm build
      - name: Cache the lockfile's Chromium revision
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: chromium-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml') }}
      # Still run installation on cache hits: it verifies the exact browser and
      # installs OS libraries on hosted runners. Never cache system libraries.
      - name: Install Playwright's Chromium (with system libraries on GitHub-hosted runners)
        if: runner.environment == 'github-hosted'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright's Chromium (self-hosted; the host already has its libraries)
        if: runner.environment != 'github-hosted'
        run: pnpm exec playwright install chromium
      - name: Browser flows and accessibility (serious and critical axe violations fail)
        run: pnpm e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  check:
    needs: changes
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.python) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-test.txt
      - name: Package installs and imports outside the checkout
        run: |
          python -m pip install -e .
          cd /tmp && python -c "import skippercast, skippercast.platform.contracts; print(skippercast.__version__)"
      - name: Install test tools
        run: python -m pip install -r requirements-test.txt
      # PRs: 3.13; main, batch/* PRs and manual bot runs: 3.11/3.12/3.13.
      # Keep the no-GIS environment test; it is not redundant with the full stack.
      - name: Python tests without GIS packages
        run: python -m pytest -m "not gis" --durations=15 --junitxml="$RUNNER_TEMP/pytest-core.xml"
      - name: Test summary
        if: always()
        run: |
          junit="$RUNNER_TEMP/pytest-core.xml"
          if [ ! -f "$junit" ]; then echo "::error::pytest wrote no JUnit report"; exit 1; fi
          python scripts/pytest_report.py "$junit" --title "Python ${{ matrix.python }}, no GIS packages" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-core-${{ matrix.python }}
          path: ${{ runner.temp }}/pytest-core.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Offline demonstration
        env:
          PYTHONPATH: src
        run: python -m skippercast demo
      - name: Rebuild regional contracts
        env:
          PYTHONPATH: src
        run: python -m skippercast.platform.build
      - name: Committed contracts match their sources
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files differ from the commit. Edit the source (regions/, catalog/, src/) and rerun 'python -m skippercast.platform.build' instead of editing dist/ by hand."
            git diff --stat
            exit 1
          fi
      - name: Documentation and publication checks
        run: python scripts/check_repository.py
      - name: Lint Python (syntax errors and undefined names)
        run: |
          python -m pip install ruff==0.16.10
          ruff check src

  web:
    # Python-independent checks run once, parallel to the Python matrix.
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check the Worker (tsc --noEmit, strict)
        run: pnpm typecheck
      - name: Forecast handling and GPX checks
        run: node --test tests/test_*.mjs
      - name: Design token contrast (WCAG 4.5:1, light and dark)
        run: node --test tests/test_contrast_ci_adoption.mjs
      - name: Copy lint (baseline only shrinks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            node scripts/check_copy.mjs
          elif git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            node scripts/check_copy.mjs --base FETCH_HEAD
          else
            echo "::notice title=Copy lint::base commit $BASE_SHA is not fetchable (force-push); skipped the growth check"
            node scripts/check_copy.mjs
          fi
      - name: Token lint (baseline only shrinks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ] && git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            node scripts/check_tokens.mjs --base FETCH_HEAD
          else
            node scripts/check_tokens.mjs
          fi
      - name: Website assets and data consistency
        run: python scripts/check_web.py
      - name: Build Worker and public assets
        run: pnpm build
      - name: Every published script, style and page is fingerprinted and resolves
        run: node scripts/check_client.mjs
      - name: Production dependencies have no high or critical advisories
        run: pnpm audit --prod --audit-level high

  e2e:
    # Stable context even when a PR cannot affect the browser inputs.
    needs: [changes, e2e-tests]
    if: always()
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the selected browser checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_plan.py gate e2e

  survey-science:
    # Keep the protected check name. Do not accept failed/cancelled/missing jobs
    # as an intentional path skip; also require core and web checks to pass.
    needs: [changes, survey-shard, e2e-tests, check, web]
    if: always()
    runs-on: ${{ vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every selected job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_plan.py gate survey-science
      - name: Download all four coverage receipts
        if: needs.changes.outputs.survey == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: pytest-survey-*
          path: ${{ runner.temp }}/survey-receipts
      - name: Prove the full collection ran exactly once with no missing shard
        if: needs.changes.outputs.survey == 'true'
        run: python3 scripts/ci_survey.py verify "$RUNNER_TEMP/survey-receipts" --count 4 --head "$GITHUB_SHA"

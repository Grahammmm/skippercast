name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  survey-science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-survey.txt
      - name: Install pinned native survey tools
        run: python -m pip install -r requirements-survey.txt -r requirements-test.txt
      - name: Rebuild and validate species search footprints
        run: |
          python scripts/build_search_plans.py
          python -m unittest discover -s tests -p test_search_plan_geometry.py -v
      - name: Committed search plans match their sources
        run: |
          if ! git diff --quiet; then
            echo "::error::Rebuilt search plans differ from the commit. Run 'python scripts/build_search_plans.py' and commit the result; do not edit dist/ by hand."
            git diff --stat
            exit 1
          fi
      - name: Native depth, uncertainty and closure fixtures
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and artifact tests
        env:
          PYTHONPATH: src
        run: python scripts/run_core_tests.py
      - name: Offline demonstration
        env:
          PYTHONPATH: src
        run: python -m skippercast demo
      - name: Rebuild regional contracts
        env:
          PYTHONPATH: src
        run: python -m skippercast.platform.build
      - name: Committed contracts match their sources
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files differ from the commit. Edit the source (regions/, catalog/, src/) and rerun 'python -m skippercast.platform.build' instead of editing dist/ by hand."
            git diff --stat
            exit 1
          fi
      - name: Documentation and publication checks
        run: python scripts/check_repository.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Forecast handling and GPX checks
        run: node --test tests/test_*.mjs
      - name: Website assets and data consistency
        run: python scripts/check_web.py
      - name: Build Worker and public assets
        run: pnpm build
      - name: Every published script, style and page is fingerprinted and resolves
        run: node scripts/check_client.mjs

name: Map, screen and publish seafloor

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: Region to advance (blank means entire catalog scope)
        type: string
        default: ''
      reach:
        description: Optional reach; its whole region is republished
        type: string
      max_new:
        description: Maximum previously unprocessed reaches to add per run (0 refreshes only)
        type: number
        default: 3
  push:
    branches: [main]
    paths:
      - catalog/surveys.json
      - catalog/habitat-rules.json
      - catalog/seafloor-screen.json
      - catalog/reaches.json
      - src/skippercast/seafloor/**
      - src/skippercast/platform/bottom_targets.py
      - scripts/build_map_tiles.py
      - .github/workflows/seafloor.yml

permissions:
  contents: read

concurrency:
  group: seafloor-publication
  cancel-in-progress: false

env:
  PYTHONPATH: src:.
  # R2-only token when configured (docs/cloudflare.md); the deploy token is the fallback.
  CLOUDFLARE_API_TOKEN: ${{ secrets.R2_PUBLISH_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.SEAFLOOR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install -r requirements-seafloor.txt
      - name: Validate manifest and required runtime before any data writes
        run: python -c "from skippercast.seafloor.manifest import load_manifest; load_manifest()"
      - name: Restore state, choose new reaches, then refresh restrictions
        id: plan
        env:
          REGION: ${{ inputs.region }}
          REACH: ${{ inputs.reach }}
          MAX_NEW: ${{ inputs.max_new }}
        run: |
          mkdir -p var/seafloor
          args=(--max-new "${MAX_NEW:-3}")
          if [ -n "$REGION" ]; then args+=(--region "$REGION"); fi
          if [ -n "$REACH" ]; then args+=(--reach "$REACH"); fi
          python -m skippercast.seafloor.jobs prepare "${args[@]}" > var/seafloor/matrix.json
          echo "matrix=$(cat var/seafloor/matrix.json)" >> "$GITHUB_OUTPUT"
          python - <<'PYCODE'
          import json, os
          matrix = json.load(open('var/seafloor/matrix.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('has_work='+str(bool(matrix['include'])).lower()+'\n')
          PYCODE
          cat var/seafloor/rollout-plan.md >> "$GITHUB_STEP_SUMMARY"

  reaches:
    needs: prepare
    if: needs.prepare.outputs.has_work == 'true'
    runs-on: ${{ vars.SEAFLOOR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install -r requirements-seafloor.txt
      - name: Validate manifest and required runtime before any data writes
        run: python -c "from skippercast.seafloor.manifest import load_manifest; load_manifest()"
      - name: Validate native source bytes, compute changed reach, save privately
        env:
          REACH: ${{ matrix.reach }}
        run: python -m skippercast.seafloor.jobs run --reach "$REACH" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [prepare, reaches]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.has_work == 'true'
    runs-on: ${{ vars.SEAFLOOR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install -r requirements-seafloor.txt
      - name: Validate manifest and required runtime before any data writes
        run: python -c "from skippercast.seafloor.manifest import load_manifest; load_manifest()"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: felt/tippecanoe
          ref: 4f2621186acfec33b63ddf636f665623c0fef2dd
          path: var/tools/tippecanoe
          persist-credentials: false
      - name: Build pinned PMTiles encoder (v2.82.0)
        run: make -C var/tools/tippecanoe -j2
      - name: Test publication gates
        run: python -m unittest tests.gis.test_seafloor_publish -v
      - name: Build complete regional archives and verify R2 read-back
        id: publication
        env:
          MATRIX: ${{ needs.prepare.outputs.matrix }}
          TIPPECANOE: var/tools/tippecanoe/tippecanoe
        run: |
          mkdir -p var/seafloor
          printf '%s\n' "$MATRIX" > var/seafloor/matrix.json
          python -m skippercast.seafloor.jobs finish --matrix var/seafloor/matrix.json > var/seafloor/published.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path('var/seafloor/published.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('title='+d['title']+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(Path('var/seafloor/ledger-pr.md').read_text())
              for key in d['published']: f.write('\nPublished /feeds/'+key+'\n')
          PY
      - name: Verify the public Worker serves the exact archive with HTTP Range
        env:
          SEAFLOOR_PUBLIC_BASE: ${{ vars.CLOUDFLARE_SITE_URL || 'https://skippercast.com' }}
        run: python -m skippercast.seafloor.verify --results var/seafloor/published.json >> "$GITHUB_STEP_SUMMARY"
      - name: Propose the small ledger change (never push main)
        id: ledger-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: codex/seafloor-ledger-refresh
          add-paths: dist/data/seafloor-ledger.json
          title: ${{ steps.publication.outputs.title }}
          body-path: var/seafloor/ledger-pr.md
          commit-message: Refresh screened seafloor ledger
      # GitHub starts no pull_request workflows for pushes made with GITHUB_TOKEN,
      # so the required survey-science check never appeared on these PRs.
      # workflow_dispatch is exempt from that rule; its check runs attach to the
      # branch head and satisfy branch protection.
      - name: Run Offline checks on the proposed ledger change
        if: steps.ledger-pr.outputs.pull-request-operation == 'created' || steps.ledger-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref codex/seafloor-ledger-refresh

      - name: Surface incomplete reaches after preserving successful work
        if: always() && steps.publication.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          result = json.load(open('var/seafloor/published.json'))
          if result['failures']:
              raise SystemExit('Some stages failed; completed reaches and coverage checkpoints were retained. See the run summary.')
          PY

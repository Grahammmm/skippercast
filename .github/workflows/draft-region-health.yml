# Ops report, not a code check (G1, 2026-10-29): legal source changes, source
# fetch failures and unavailable critical feeds are outside data, so this runs
# only on a schedule or by hand. Its failure is reported in the job summary and
# artifacts for legal/source review; it does not turn main red. Do not add a
# push or pull_request trigger. The code check for the same collector is
# draft-region-rehearsal.yml.
name: Draft region legal and source health

on:
  schedule:
    - cron: "23 6 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ${{ vars.DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        region_id: [bodega-point-reyes, fort-bragg-point-arena, crescent-city, shelter-cove-north-mendocino, santa-cruz-monterey-bay, monterey-point-sur, big-sur-coast, south-big-sur-san-simeon]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The forecast sampler shared with the Worker runs on Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-sst.txt
      - name: Install reviewed NOAA NetCDF decoder
        run: python -m pip install -r requirements-sst.txt
      - name: Validate draft and collect source evidence
        env:
          PYTHONPATH: src
          REGION_ID: ${{ matrix.region_id }}
        run: |
          python - <<'PY'
          import os
          from skippercast.platform.contracts import load_region
          region = load_region(os.environ['REGION_ID'])
          if region['status'] not in ('draft', 'preview'):
              raise SystemExit('This workflow accepts draft or preview regions only')
          print(region['id'], region['name'])
          PY
          python scripts/refresh_regions.py daily \
            --output "var/draft-rehearsal/${REGION_ID}" \
            --only-region "${REGION_ID}" --include-drafts
      - name: Report legal and source health
        if: always()
        env:
          REGION_ID: ${{ matrix.region_id }}
        run: python scripts/draft_region_health_report.py --region "${REGION_ID}"
      - name: Upload unpublished evidence and health
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draft-rehearsal-${{ matrix.region_id }}-${{ github.run_id }}
          path: var/draft-rehearsal/${{ matrix.region_id }}/
          if-no-files-found: warn
          retention-days: 14

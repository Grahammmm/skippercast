name: Daily fishing evidence

on:
  schedule:
    - cron: "17 4 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/skippercast/pipeline/**"
      - ".github/workflows/daily-data.yml"
      - "dist/data/regulations.json"
      - "dist/regions/**/regulations.json"
      - "regions/**"
      - "catalog/**"
      - "jurisdictions/**"
      - "src/skippercast/platform/**"
      - "scripts/refresh_regions.py"
      - "scripts/report_regulations.py"
      - "scripts/collect_recent_intel.py"
      - "scripts/discover_noaa_surveys.py"
      - "scripts/audit_noaa_survey_products.py"
      - "scripts/triage_noaa_bag_files.py"
      - "scripts/discover_usgs_map_blocks.py"
      - "scripts/audit_usgs_map_metadata.py"
      - "scripts/discover_usgs_doi_releases.py"
      - "scripts/audit_usgs_doi_metadata.py"
      - "scripts/collect_noaa_groundfish_areas.py"
      - "scripts/refresh_enc_hazards.py"
      - "scripts/audit_enc_context_overlap.py"
      - "skills/skippercast-recent-intel/**"

permissions:
  contents: write

concurrency:
  group: daily-fishing-evidence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Load pinned last30days research engine
        uses: actions/checkout@v4
        with:
          repository: mvanhorn/last30days-skill
          ref: 349ca444b4fda466e74d471dffa2aff36bb997f1
          path: var/last30days-upstream
          persist-credentials: false
      - name: Test evidence parsing and failure handling
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_pipeline*.py' -v
      - name: Load previous published facts
        run: |
          mkdir -p var/daily
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data --depth=1
            git worktree add --detach var/published FETCH_HEAD
            cp var/published/latest.json var/previous.json
            cp -R var/published/history var/daily/history
          fi
      - name: Collect and validate public sources
        env:
          PYTHONPATH: src
        run: python scripts/refresh_regions.py daily --output var/daily --previous-root var/published
      - name: Discover recent local fishing discussions
        continue-on-error: true
        run: >-
          python scripts/collect_recent_intel.py
          --engine var/last30days-upstream/skills/last30days/scripts/last30days.py
          --output var/daily
          --previous var/published/recent-intel.json
      - name: Audit source-document access
        env:
          PYTHONPATH: src
        run: python -m skippercast.platform.source_audit --output var/daily/source-access.json
      - name: Refresh statewide regional and seasonal source checks
        env:
          PYTHONPATH: src
        run: python -m skippercast.pipeline.coastal_watch --output var/daily --previous-root var/published --report-root var/daily
      - name: Refresh NOAA federal groundfish areas
        continue-on-error: true
        run: python scripts/collect_noaa_groundfish_areas.py --output var/daily/noaa-federal-areas.json --previous var/published/noaa-federal-areas.json
      - name: Discover NOAA BAG survey leads for all coastal sectors
        continue-on-error: true
        run: python scripts/discover_noaa_surveys.py --output var/daily/survey-discovery.json --previous var/published/survey-discovery.json --max-age-days 30
      - name: Inventory original NOAA survey products
        continue-on-error: true
        run: python scripts/audit_noaa_survey_products.py --discovery var/daily/survey-discovery.json --output var/daily/survey-products.json --previous var/published/survey-products.json --max-age-days 30
      - name: Check original NOAA BAG file access
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/triage_noaa_bag_files.py --discovery var/daily/survey-discovery.json --products var/daily/survey-products.json --output var/daily/bag-head-inventory.json --previous var/published/bag-head-inventory.json --max-age-days 30
      - name: Refresh bounded NOAA ENC danger review
        continue-on-error: true
        run: python scripts/refresh_enc_hazards.py --scope santa-barbara-island --output var/daily/enc-hazards/santa-barbara-island.geojson
      - name: Refresh Point Reyes and Tomales NOAA ENC danger review
        continue-on-error: true
        run: python scripts/refresh_enc_hazards.py --scope point-reyes-tomales --output var/daily/enc-hazards/point-reyes-tomales.geojson
      - name: Discover USGS state-waters map-block products
        continue-on-error: true
        run: python scripts/discover_usgs_map_blocks.py --output var/daily/usgs-map-blocks.json --previous var/published/usgs-map-blocks.json --max-age-days 30
      - name: Discover additional official USGS CSMP map-block products
        continue-on-error: true
        run: python scripts/discover_usgs_map_blocks.py --catalog-family csmp --output var/daily/usgs-csmp-map-blocks.json --previous var/published/usgs-csmp-map-blocks.json --max-age-days 30
      - name: Verify original USGS map-block XML metadata
        continue-on-error: true
        run: python scripts/audit_usgs_map_metadata.py --blocks var/daily/usgs-map-blocks.json --output var/daily/usgs-map-metadata.json --previous var/published/usgs-map-metadata.json --max-age-days 30
      - name: Verify original USGS CSMP XML metadata
        continue-on-error: true
        run: python scripts/audit_usgs_map_metadata.py --blocks var/daily/usgs-csmp-map-blocks.json --output var/daily/usgs-csmp-map-metadata.json --previous var/published/usgs-csmp-map-metadata.json --max-age-days 30
      - name: Discover newer USGS DOI release products
        continue-on-error: true
        run: python scripts/discover_usgs_doi_releases.py --output var/daily/usgs-doi-releases.json --previous var/published/usgs-doi-releases.json --max-age-days 30
      - name: Verify original USGS DOI XML metadata
        continue-on-error: true
        run: python scripts/audit_usgs_doi_metadata.py --releases var/daily/usgs-doi-releases.json --output var/daily/usgs-doi-metadata.json --previous var/published/usgs-doi-metadata.json --max-age-days 30
      - name: Publish an atomic data snapshot
        run: |
          if [ -d var/published ]; then
            cp var/daily/latest.json var/daily/health.json var/daily/source-access.json var/published/
            if [ -f var/daily/recent-intel.json ]; then cp var/daily/recent-intel.json var/published/; fi
            if [ -f var/daily/survey-discovery.json ]; then cp var/daily/survey-discovery.json var/published/; fi
            if [ -f var/daily/survey-products.json ]; then cp var/daily/survey-products.json var/published/; fi
            if [ -f var/daily/bag-head-inventory.json ]; then cp var/daily/bag-head-inventory.json var/published/; fi
            if [ -f var/daily/enc-hazards/santa-barbara-island.geojson ]; then mkdir -p var/published/enc-hazards; cp var/daily/enc-hazards/santa-barbara-island.geojson var/published/enc-hazards/; fi
            if [ -f var/daily/enc-hazards/point-reyes-tomales.geojson ]; then mkdir -p var/published/enc-hazards; cp var/daily/enc-hazards/point-reyes-tomales.geojson var/published/enc-hazards/; fi
            if [ -f var/daily/usgs-map-blocks.json ]; then cp var/daily/usgs-map-blocks.json var/published/; fi
            if [ -f var/daily/usgs-map-metadata.json ]; then cp var/daily/usgs-map-metadata.json var/published/; fi
            if [ -f var/daily/usgs-csmp-map-blocks.json ]; then cp var/daily/usgs-csmp-map-blocks.json var/published/; fi
            if [ -f var/daily/usgs-csmp-map-metadata.json ]; then cp var/daily/usgs-csmp-map-metadata.json var/published/; fi
            if [ -f var/daily/usgs-doi-releases.json ]; then cp var/daily/usgs-doi-releases.json var/published/; fi
            if [ -f var/daily/usgs-doi-metadata.json ]; then cp var/daily/usgs-doi-metadata.json var/published/; fi
            mkdir -p var/published/regions
            cp -R var/daily/regions/. var/published/regions/
            mkdir -p var/published/coastal
            cp -R var/daily/coastal/. var/published/coastal/
            if [ -f var/daily/noaa-federal-areas.json ]; then cp var/daily/noaa-federal-areas.json var/published/; fi
            rm -rf var/published/history
            cp -R var/daily/history var/published/history
          else
            mkdir -p var/published
            git -C var/published init -b data
            git -C var/published remote add origin "$(git remote get-url origin)"
            git -C var/published config http.https://github.com/.extraheader "$(git config --get http.https://github.com/.extraheader)"
            cp -R var/daily/. var/published/
          fi
          cp docs/data-feed-readme.md var/published/README.md
          git -C var/published config user.name 'github-actions[bot]'
          git -C var/published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C var/published add latest.json health.json source-access.json history regions coastal README.md
          if [ -f var/published/recent-intel.json ]; then git -C var/published add recent-intel.json; fi
          if [ -f var/published/survey-discovery.json ]; then git -C var/published add survey-discovery.json; fi
          if [ -f var/published/survey-products.json ]; then git -C var/published add survey-products.json; fi
          if [ -f var/published/bag-head-inventory.json ]; then git -C var/published add bag-head-inventory.json; fi
          if [ -f var/published/enc-hazards/santa-barbara-island.geojson ]; then git -C var/published add enc-hazards/santa-barbara-island.geojson; fi
          if [ -f var/published/enc-hazards/point-reyes-tomales.geojson ]; then git -C var/published add enc-hazards/point-reyes-tomales.geojson; fi
          if [ -f var/published/usgs-map-blocks.json ]; then git -C var/published add usgs-map-blocks.json; fi
          if [ -f var/published/usgs-map-metadata.json ]; then git -C var/published add usgs-map-metadata.json; fi
          if [ -f var/published/usgs-csmp-map-blocks.json ]; then git -C var/published add usgs-csmp-map-blocks.json; fi
          if [ -f var/published/usgs-csmp-map-metadata.json ]; then git -C var/published add usgs-csmp-map-metadata.json; fi
          if [ -f var/published/usgs-doi-releases.json ]; then git -C var/published add usgs-doi-releases.json; fi
          if [ -f var/published/usgs-doi-metadata.json ]; then git -C var/published add usgs-doi-metadata.json; fi
          if [ -f var/published/noaa-federal-areas.json ]; then git -C var/published add noaa-federal-areas.json; fi
          git -C var/published commit -m 'Refresh public fishing evidence'
          git -C var/published push origin HEAD:refs/heads/data
      - name: Report source health
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path('var/daily/latest.json').read_text())
          h = d['health']
          summary = [f"## Fishing evidence: {h['status']}", f"Collected {d['completed_at']}",
                     f"{h['sources_ok']}/{h['sources_total']} sources healthy; {h['recent_report_days_ok']}/7 recent report pages available.",
                     'Public feed: https://raw.githubusercontent.com/Grahammmm/skippercast/data/latest.json', '']
          for ident in h['issues']:
              s = d['sources'][ident]
              summary.append(f"- {s['name']}: {s['status']} — {s.get('issue', 'See source record')}")
          coast = json.loads(Path('var/daily/coastal/latest.json').read_text())
          coastal_health = coast['health']
          summary.extend(['', f"## California coastal source watch: {coastal_health['status']}",
                          f"Collected {coast['completed_at']}"])
          rules = [(key, record) for key, record in coast['sources'].items() if key.endswith('-rules')]
          summary.append(f"CDFW regional rules documents: {sum(record['status'] == 'ok' for _, record in rules)}/{len(rules)} healthy.")
          for ident in coastal_health['issues']:
              record = coast['sources'][ident]
              summary.append(f"- {record['name']}: {record['status']} — {record.get('issue', 'See source record')}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(summary))
          if h['issues']:
              print('::warning::Some sources are missing, stale, or failed. The feed preserves those statuses.')
          if coastal_health['issues']:
              print('::warning::Some California coastal sources are missing, stale, or failed. See coastal status and do not infer fishing permission.')
          regional = json.loads(Path('var/daily/regions/index.json').read_text())
          for row in regional['regions']:
              print(f"{row['region_id']}: {row['status']} ({len(row['issues'])} source issues)")
          if any(row['status'] == 'failed' for row in regional['regions']):
              raise SystemExit('A regional daily feed has failed core coverage; explicit failure state published.')
          if not h['critical_available']:
              raise SystemExit('Core report/observation coverage failed; failure state published for the app.')
          PY
      - name: Report coastal watch health
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('var/daily/coastal/status.json')
          if not p.exists(): raise SystemExit('Coastal source watch did not produce a snapshot')
          d=json.loads(p.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n## Coastal source watch\n'+d['completed_at']+' · '+d['health']['status']+'\n')
              for key,s in d['sources'].items():
                  f.write(f"- {key}: {s['status']} · published {(s.get('data') or {}).get('published_date','not applicable')}\n")
          if d['health']['issues']: raise SystemExit('Coastal source issues: '+', '.join(d['health']['issues']))
          PY
      - name: Report federal groundfish area health
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('var/daily/noaa-federal-areas.json')
          if not p.is_file(): raise SystemExit('NOAA federal area refresh produced no snapshot')
          d=json.loads(p.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"\n## NOAA federal groundfish areas\n{d['status']} · {d['feature_count']} features from {len(d['source_layers'])} GIS layers · retrieved {d['retrieved_at']}\n")
          if d['status']!='ok': raise SystemExit('Federal groundfish area refresh retained old geometry')
          PY
      - name: Report recent discussion coverage
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('var/daily/recent-intel.json')
          if not path.is_file():
              raise SystemExit('Recent discussion research produced no snapshot; prior feed remains dated.')
          else:
              data=json.loads(path.read_text())
              health=data['health']
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write(f"\n## Recent discussion leads\n{health['jobs_usable']}/{health['jobs_total']} searches returned usable source status · {health['watchlist_queries']} rotating queries · {len(data['candidates'])} dated candidates · {health['status']}\n")
              if health['status'] != 'ok': print('::warning::Recent discussion coverage is degraded; inspect source outcomes.')
              if health['jobs_usable'] == 0: raise SystemExit('No recent discussion source completed; explicit failure status was published.')
          PY
      - name: Report regulation coverage in every region
        if: always()
        run: python scripts/report_regulations.py --root var/daily
      - name: Report NOAA ENC danger-source coverage
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n## NOAA ENC danger review\n')
              for scope in ('santa-barbara-island', 'point-reyes-tomales'):
                  path = Path(f'var/daily/enc-hazards/{scope}.geojson')
                  if not path.is_file():
                      raise SystemExit(f'NOAA ENC danger-layer refresh produced no {scope} snapshot')
                  data = json.loads(path.read_text())
                  if (data.get('status') != 'charted-danger-screen-only'
                          or data.get('scope_id') != scope
                          or len(data.get('query_receipts', [])) != 18):
                      raise SystemExit(f'NOAA ENC danger-layer review incomplete: {scope}')
                  out.write(f"{scope}: {len(data['features'])} charted features across 18 complete layer queries; retrieved {data['checked_at']}. Not navigation clearance.\n")
          PY
      - name: Report NOAA survey discovery coverage
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('var/daily/survey-discovery.json')
          if not p.is_file(): raise SystemExit('NOAA survey discovery produced no status; inspect collection step')
          d=json.loads(p.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"\n## NOAA BAG survey discovery\n{d['health']['status']} · {d['distinct_survey_leads']} distinct catalog leads · {d['sector_count']} sectors · last complete {d.get('last_complete_scan_at') or 'none'}\n")
          if d['health']['issues']: raise SystemExit('Survey catalog queries failed: '+', '.join(d['health']['issues']))
          PY
      - name: Report NOAA survey product coverage
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('var/daily/survey-products.json')
          if not p.is_file(): raise SystemExit('NOAA survey product inventory produced no status')
          d=json.loads(p.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"\n## NOAA original survey products\n{d['health']['status']} · {d['bag_link_count']}/{d['survey_count']} pages link BAG grids · {d['report_link_count']} link descriptive reports · last complete {d.get('last_complete_scan_at') or 'none'}\n")
          if d['health']['issues']: raise SystemExit('Survey product pages failed: '+', '.join(d['health']['issues'][:15]))
          PY
      - name: Report native-product discovery coverage
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines=['\n## Native seabed source inventory']
          unhealthy=[]
          for name,label in [('bag-head-inventory.json','NOAA BAG files'),('usgs-map-blocks.json','USGS DS 781 map blocks'),('usgs-map-metadata.json','USGS DS 781 original XML records'),('usgs-csmp-map-blocks.json','USGS CSMP map blocks'),('usgs-csmp-map-metadata.json','USGS CSMP original XML records'),('usgs-doi-releases.json','USGS newer DOI releases'),('usgs-doi-metadata.json','USGS newer DOI XML records')]:
              p=Path('var/daily')/name
              if not p.is_file():
                  lines.append(f'- {label}: missing inventory')
                  unhealthy.append(label)
                  continue
              d=json.loads(p.read_text())
              count=next((d[key] for key in ('accessible_file_count','block_count','verified_metadata_count','release_count') if key in d),0)
              lines.append(f"- {label}: {d['health']['status']} · {count} checked files, blocks, releases or XML records; fishing locations remain unapproved")
              if d['health']['status']!='ok': unhealthy.append(label)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('\n'.join(lines)+'\n')
          if unhealthy: raise SystemExit('Native seabed discovery degraded or unavailable: '+', '.join(unhealthy))
          PY

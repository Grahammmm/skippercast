name: Daily fishing evidence

on:
  schedule:
    - cron: "17 4 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/skippercast/pipeline/**"
      - ".github/workflows/daily-data.yml"
      - "dist/data/regulations.json"
      - "dist/regions/**/regulations.json"
      - "regions/**"
      - "catalog/**"
      - "jurisdictions/**"
      - "src/skippercast/platform/**"
      - "scripts/refresh_regions.py"
      - "scripts/report_regulations.py"

permissions:
  contents: write

concurrency:
  group: daily-fishing-evidence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test evidence parsing and failure handling
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_pipeline*.py' -v
      - name: Load previous published facts
        run: |
          mkdir -p var/daily
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data --depth=1
            git worktree add --detach var/published FETCH_HEAD
            cp var/published/latest.json var/previous.json
            cp -R var/published/history var/daily/history
          fi
      - name: Collect and validate public sources
        env:
          PYTHONPATH: src
        run: python scripts/refresh_regions.py daily --output var/daily --previous-root var/published
      - name: Audit source-document access
        env:
          PYTHONPATH: src
        run: python -m skippercast.platform.source_audit --output var/daily/source-access.json
      - name: Refresh statewide regional and seasonal source checks
        env:
          PYTHONPATH: src
        run: python -m skippercast.pipeline.coastal_watch --output var/daily --previous-root var/published --report-root var/daily
      - name: Publish an atomic data snapshot
        run: |
          if [ -d var/published ]; then
            cp var/daily/latest.json var/daily/health.json var/daily/source-access.json var/published/
            mkdir -p var/published/regions
            cp -R var/daily/regions/. var/published/regions/
            mkdir -p var/published/coastal
            cp -R var/daily/coastal/. var/published/coastal/
            rm -rf var/published/history
            cp -R var/daily/history var/published/history
          else
            mkdir -p var/published
            git -C var/published init -b data
            git -C var/published remote add origin "$(git remote get-url origin)"
            git -C var/published config http.https://github.com/.extraheader "$(git config --get http.https://github.com/.extraheader)"
            cp -R var/daily/. var/published/
          fi
          cp docs/data-feed-readme.md var/published/README.md
          git -C var/published config user.name 'github-actions[bot]'
          git -C var/published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C var/published add latest.json health.json source-access.json history regions coastal README.md
          git -C var/published commit -m 'Refresh public fishing evidence'
          git -C var/published push origin HEAD:refs/heads/data
      - name: Report source health
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path('var/daily/latest.json').read_text())
          h = d['health']
          summary = [f"## Fishing evidence: {h['status']}", f"Collected {d['completed_at']}",
                     f"{h['sources_ok']}/{h['sources_total']} sources healthy; {h['recent_report_days_ok']}/7 recent report pages available.",
                     'Public feed: https://raw.githubusercontent.com/Grahammmm/skippercast/data/latest.json', '']
          for ident in h['issues']:
              s = d['sources'][ident]
              summary.append(f"- {s['name']}: {s['status']} — {s.get('issue', 'See source record')}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(summary))
          if h['issues']:
              print('::warning::Some sources are missing, stale, or failed. The feed preserves those statuses.')
          regional = json.loads(Path('var/daily/regions/index.json').read_text())
          for row in regional['regions']:
              print(f"{row['region_id']}: {row['status']} ({len(row['issues'])} source issues)")
          if any(row['status'] == 'failed' for row in regional['regions']):
              raise SystemExit('A regional daily feed has failed core coverage; explicit failure state published.')
          if not h['critical_available']:
              raise SystemExit('Core report/observation coverage failed; failure state published for the app.')
          PY
      - name: Report coastal watch health
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('var/daily/coastal/status.json')
          if not p.exists(): raise SystemExit('Coastal source watch did not produce a snapshot')
          d=json.loads(p.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n## Coastal source watch\n'+d['completed_at']+' · '+d['health']['status']+'\n')
              for key,s in d['sources'].items():
                  f.write(f"- {key}: {s['status']} · published {(s.get('data') or {}).get('published_date','not applicable')}\n")
          if d['health']['issues']: raise SystemExit('Coastal source issues: '+', '.join(d['health']['issues']))
          PY
      - name: Report regulation coverage in every region
        if: always()
        run: python scripts/report_regulations.py --root var/daily

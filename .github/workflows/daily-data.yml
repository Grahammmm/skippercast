name: Daily fishing evidence

on:
  schedule:
    - cron: "17 4 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/skippercast/pipeline/**"
      - ".github/workflows/daily-data.yml"
      - "dist/data/regulations.json"
      - "dist/regions/**/regulations.json"
      - "regions/**"
      - "catalog/**"
      - "jurisdictions/**"
      - "src/skippercast/platform/**"
      - "scripts/refresh_regions.py"
      - "scripts/report_regulations.py"
      - "scripts/collect_recent_intel.py"
      - "scripts/discover_noaa_surveys.py"
      - "scripts/audit_noaa_survey_products.py"
      - "scripts/collect_noaa_groundfish_areas.py"
      - "skills/skippercast-recent-intel/**"

permissions:
  contents: write

concurrency:
  group: daily-fishing-evidence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The forecast sampler shared with the Worker runs on Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-sst.txt
      - name: Install reviewed NOAA NetCDF decoder
        run: python -m pip install -r requirements-sst.txt -r requirements-publish.txt
      - name: Load pinned last30days research engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mvanhorn/last30days-skill
          ref: 349ca444b4fda466e74d471dffa2aff36bb997f1
          path: var/last30days-upstream
          persist-credentials: false
      - name: Test evidence parsing and failure handling
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -p 'test_pipeline*.py' -v
      - name: Load previous published facts
        run: |
          mkdir -p var/daily
          bash scripts/publish_branch_snapshot.sh --load data var/published
          if git -C var/published rev-parse -q --verify HEAD >/dev/null; then
            cp var/published/latest.json var/previous.json
            cp -R var/published/history var/daily/history
          fi
      - name: Collect and validate public sources
        env:
          PYTHONPATH: src
        run: python scripts/refresh_regions.py daily --output var/daily --previous-root var/published
      - name: Discover recent local fishing discussions
        continue-on-error: true
        run: >-
          python scripts/collect_recent_intel.py
          --engine var/last30days-upstream/skills/last30days/scripts/last30days.py
          --output var/daily
          --previous var/published/recent-intel.json
      - name: Audit source-document access
        env:
          PYTHONPATH: src
        run: python -m skippercast.platform.source_audit --output var/daily/source-access.json
      - name: Refresh statewide regional and seasonal source checks
        env:
          PYTHONPATH: src
        run: python -m skippercast.pipeline.coastal_watch --output var/daily --previous-root var/published --report-root var/daily
      - name: Refresh NOAA federal groundfish areas
        continue-on-error: true
        run: python scripts/collect_noaa_groundfish_areas.py --output var/daily/noaa-federal-areas.json --previous var/published/noaa-federal-areas.json
      - name: Discover NOAA BAG survey leads for all coastal sectors
        continue-on-error: true
        run: python scripts/discover_noaa_surveys.py --output var/daily/survey-discovery.json --previous var/published/survey-discovery.json --max-age-days 30
      - name: Inventory original NOAA survey products
        continue-on-error: true
        run: python scripts/audit_noaa_survey_products.py --discovery var/daily/survey-discovery.json --output var/daily/survey-products.json --previous var/published/survey-products.json --max-age-days 30
      - name: Publish an atomic data snapshot
        env:
          # R2-only token when configured (docs/cloudflare.md); the deploy token is the fallback.
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_PUBLISH_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if git -C var/published rev-parse -q --verify HEAD >/dev/null; then
            cp var/daily/latest.json var/daily/health.json var/daily/source-access.json var/published/
            if [ -f var/daily/recent-intel.json ]; then cp var/daily/recent-intel.json var/published/; fi
            if [ -f var/daily/survey-discovery.json ]; then cp var/daily/survey-discovery.json var/published/; fi
            if [ -f var/daily/survey-products.json ]; then cp var/daily/survey-products.json var/published/; fi
            mkdir -p var/published/regions
            cp -R var/daily/regions/. var/published/regions/
            # Each collected region's history was pruned to 90 days in var/daily; replace
            # the published copy so old days are dropped (a failed region keeps its own).
            for history in var/daily/regions/*/history; do
              [ -d "$history" ] || continue
              region=$(basename "$(dirname "$history")")
              rm -rf "var/published/regions/$region/history"
              cp -R "$history" "var/published/regions/$region/history"
            done
            mkdir -p var/published/coastal
            cp -R var/daily/coastal/. var/published/coastal/
            if [ -f var/daily/noaa-federal-areas.json ]; then cp var/daily/noaa-federal-areas.json var/published/; fi
            rm -rf var/published/history
            cp -R var/daily/history var/published/history
          else
            cp -R var/daily/. var/published/
          fi
          # Research inventories now run in research-daily.yml (artifacts only); drop the
          # copies earlier runs published so the feed holds product outputs only.
          rm -rf var/published/enc-hazards
          rm -f var/published/bag-head-inventory.json var/published/usgs-map-blocks.json \
            var/published/usgs-map-metadata.json var/published/usgs-csmp-map-blocks.json \
            var/published/usgs-csmp-map-metadata.json var/published/usgs-doi-releases.json \
            var/published/usgs-doi-metadata.json
          cp docs/data-feed-readme.md var/published/README.md
          # One parentless commit, force-pushed with a lease: the branch never grows history.
          bash scripts/publish_branch_snapshot.sh data var/published 'Refresh public fishing evidence'
          bash scripts/publish_branch_r2.sh var/published data
      - name: Verify the public site serves this snapshot
        if: vars.FEEDS_PUBLIC_BASE != ''
        env:
          FEEDS_PUBLIC_BASE: ${{ vars.FEEDS_PUBLIC_BASE }}
        run: |
          published_at=$(python -c 'import json; print(json.load(open("var/published/latest.json")).get("published_at", ""))')
          python scripts/verify_published_feed.py "${FEEDS_PUBLIC_BASE%/}/feeds/data/latest.json" \
            "$GITHUB_RUN_ID" --published-at "$published_at"
      - name: Report source health
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path('var/daily/latest.json').read_text())
          h = d['health']
          summary = [f"## Fishing evidence: {h['status']}", f"Collected {d['completed_at']}",
                     f"{h['sources_ok']}/{h['sources_total']} sources healthy; {h['recent_report_days_ok']}/7 recent report pages available.",
                     'Public feed: https://raw.githubusercontent.com/Grahammmm/skippercast/data/latest.json', '']
          for ident in h['issues']:
              s = d['sources'][ident]
              summary.append(f"- {s['name']}: {s['status']} — {s.get('issue', 'See source record')}")
          coast = json.loads(Path('var/daily/coastal/latest.json').read_text())
          coastal_health = coast['health']
          summary.extend(['', f"## California coastal source watch: {coastal_health['status']}",
                          f"Collected {coast['completed_at']}"])
          rules = [(key, record) for key, record in coast['sources'].items() if key.endswith('-rules')]
          summary.append(f"CDFW regional rules documents: {sum(record['status'] == 'ok' for _, record in rules)}/{len(rules)} healthy.")
          for ident in coastal_health['issues']:
              record = coast['sources'][ident]
              summary.append(f"- {record['name']}: {record['status']} — {record.get('issue', 'See source record')}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(summary))
          if h['issues']:
              print('::warning::Some sources are missing, stale, or failed. The feed preserves those statuses.')
          if coastal_health['issues']:
              print('::warning::Some California coastal sources are missing, stale, or failed. See coastal status and do not infer fishing permission.')
          regional = json.loads(Path('var/daily/regions/index.json').read_text())
          for row in regional['regions']:
              print(f"{row['region_id']}: {row['status']} ({len(row['issues'])} source issues)")
          if any(row['status'] == 'failed' for row in regional['regions']):
              raise SystemExit('A regional daily feed has failed core coverage; explicit failure state published.')
          if not h['critical_available']:
              raise SystemExit('Core report/observation coverage failed; failure state published for the app.')
          PY
      - name: Report coastal watch health
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('var/daily/coastal/status.json')
          if not p.exists(): raise SystemExit('Coastal source watch did not produce a snapshot')
          d=json.loads(p.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n## Coastal source watch\n'+d['completed_at']+' · '+d['health']['status']+'\n')
              for key,s in d['sources'].items():
                  f.write(f"- {key}: {s['status']} · published {(s.get('data') or {}).get('published_date','not applicable')}\n")
          if d['health']['issues']: raise SystemExit('Coastal source issues: '+', '.join(d['health']['issues']))
          PY
      - name: Report federal groundfish area health
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('var/daily/noaa-federal-areas.json')
          if not p.is_file(): raise SystemExit('NOAA federal area refresh produced no snapshot')
          d=json.loads(p.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"\n## NOAA federal groundfish areas\n{d['status']} · {d['feature_count']} features from {len(d['source_layers'])} GIS layers · retrieved {d['retrieved_at']}\n")
          if d['status']!='ok': raise SystemExit('Federal groundfish area refresh retained old geometry')
          PY
      - name: Report recent discussion coverage
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('var/daily/recent-intel.json')
          if not path.is_file():
              raise SystemExit('Recent discussion research produced no snapshot; prior feed remains dated.')
          else:
              data=json.loads(path.read_text())
              health=data['health']
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write(f"\n## Recent discussion leads\n{health['jobs_usable']}/{health['jobs_total']} searches returned usable source status · {health['watchlist_queries']} rotating queries · {len(data['candidates'])} dated candidates · {health['status']}\n")
              if health['status'] != 'ok': print('::warning::Recent discussion coverage is degraded; inspect source outcomes.')
              if health['jobs_usable'] == 0: raise SystemExit('No recent discussion source completed; explicit failure status was published.')
          PY
      - name: Report regulation coverage in every region
        if: always()
        run: python scripts/report_regulations.py --root var/daily
      - name: Report NOAA survey discovery coverage
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('var/daily/survey-discovery.json')
          if not p.is_file(): raise SystemExit('NOAA survey discovery produced no status; inspect collection step')
          d=json.loads(p.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"\n## NOAA BAG survey discovery\n{d['health']['status']} · {d['distinct_survey_leads']} distinct catalog leads · {d['sector_count']} sectors · last complete {d.get('last_complete_scan_at') or 'none'}\n")
          if d['health']['issues']: raise SystemExit('Survey catalog queries failed: '+', '.join(d['health']['issues']))
          PY
      - name: Report NOAA survey product coverage
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('var/daily/survey-products.json')
          if not p.is_file(): raise SystemExit('NOAA survey product inventory produced no status')
          d=json.loads(p.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"\n## NOAA original survey products\n{d['health']['status']} · {d['bag_link_count']}/{d['survey_count']} pages link BAG grids · {d['report_link_count']} link descriptive reports · last complete {d.get('last_complete_scan_at') or 'none'}\n")
          if d['health']['issues']: raise SystemExit('Survey product pages failed: '+', '.join(d['health']['issues'][:15]))
          PY

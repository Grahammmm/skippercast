name: Monthly California fish survey evidence review

on:
  schedule:
    - cron: "19 11 2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nos-historic-seabed-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install spatial readers
        run: python -m pip install pyproj==3.7.1 shapely==2.1.2
      - name: Check research-only sample-distance gates
        run: python -m unittest tests.test_nos_seabed_samples -v
      - name: Query NOAA/NOS historic samples near Monterey research outlines
        run: >-
          python scripts/audit_nos_seabed_samples.py --scope monterey
          --output var/review/nos-seabed-monterey-gap-audit.json
      - name: Upload aggregate review without sample coordinates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nos-seabed-monterey-gap-audit
          path: var/review/nos-seabed-monterey-gap-audit.json
          retention-days: 30
  central-dataone-rov-spot-precision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check rounded-position and changed-source safeguards
        run: python -m unittest tests.test_dataone_rov_spot_precision -v
      - name: Download original OPC DataONE ROV fish-count object
        run: |
          mkdir -p var/review
          curl --fail --location --silent --show-error --retry 2 --max-time 600 \
            'https://cn.dataone.org/cn/v2/resolve/urn%3Auuid%3Abc58965f-f3b1-421e-8b2a-45690bb695fb' \
            --output var/review/central-dataone-rov-fish-count.csv
      - name: Verify source precision before any spot promotion
        run: >-
          python scripts/audit_dataone_rov_spot_precision.py
          --input var/review/central-dataone-rov-fish-count.csv
          --output var/review/central-dataone-rov-300ft-spot-precision.json
          --verify dist/data/central-dataone-rov-300ft-spot-precision.json
      - name: Upload aggregate review without observation coordinates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: central-dataone-rov-spot-precision
          path: var/review/central-dataone-rov-300ft-spot-precision.json
          retention-days: 30
  estero-original-depth-and-independent-character:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned original-grid readers
        run: python -m pip install numpy==2.2.6 scipy==1.17.1 rasterio==1.4.3 pyproj==3.7.1 shapely==2.1.2 pyshp==2.3.1
      - name: Check depth-datum and research-only gates
        run: python -m unittest tests.test_point_estero_original_pair tests.test_usgs_estero_2012_original tests.test_usgs_source_registry_datum tests.test_estero_research_blocks tests.test_estero_camera_block_gap tests.test_csumb_estero_2010_blocks tests.test_estero_vdatum_spatial tests.test_estero_wgs84_direct tests.test_estero_wgs84_2008_character tests.test_estero_noaa_bag_catalog_gap -v
      - name: Recheck original 2008 Point Estero pair
        run: >-
          python scripts/audit_point_estero_original_pair.py --fetch
          --output var/review/point-estero-original-paired-200-300ft-review.json
      - name: Recheck original 2012 Estero Bay depth and sounding spread
        run: >-
          python scripts/audit_usgs_estero_2012_original.py --fetch
          --output var/review/usgs-estero-bay-2012-original-200-300ft-review.json
      - name: Recheck independent 2008/2012 overlap
        run: >-
          python scripts/audit_estero_2012_2008_overlap.py
          --output var/review/estero-independent-2012-depth-2008-character-overlap.json
      - name: Fetch current Estero CDFW, NOAA federal and ENC research screens
        run: |
          python -m scripts.collect_estero_mpa_review --output var/review/estero-cdfw-mpas.geojson
          python scripts/collect_noaa_groundfish_areas.py --output var/review/estero-federal-areas.geojson
          python scripts/refresh_enc_hazards.py --scope estero-independent-deep-hard-context --output var/review/enc-hazards-estero-independent-deep-hard.geojson
      - name: Screen whole 100 m Estero research blocks with 100 m margin
        run: >-
          python scripts/audit_estero_research_blocks.py
          --mpas var/review/estero-cdfw-mpas.geojson
          --federal var/review/estero-federal-areas.geojson
          --enc var/review/enc-hazards-estero-independent-deep-hard.geojson
          --private-blocks var/review/estero-nominal-research-blocks.geojson
          --output var/review/estero-2012-depth-class-closure-block-review.json
      - name: Recheck original USGS camera support for Estero research blocks
        run: >-
          python scripts/audit_estero_camera_block_gap.py --download-video
          --blocks var/review/estero-nominal-research-blocks.geojson
          --output var/review/estero-original-camera-block-gap.json
          --verify dist/data/estero-original-camera-block-gap.json
      - name: Cross-check original 2010 CSUMB 2 m bathymetry on the Estero blocks
        run: >-
          python scripts/audit_csumb_estero_2010_blocks.py --fetch
          --output var/review/csumb-scc-2010-estero-original-block-coverage.json
      - name: Recheck VDatum source-frame acceptance without converting a grid
        run: >-
          python scripts/audit_estero_vdatum_frames.py --expect-current-gates
          --output var/review/estero-2012-vdatum-frame-review.json
      - name: Recheck spatial VDatum offset without converting the source raster
        run: >-
          python scripts/audit_estero_vdatum_spatial.py
          --blocks var/review/estero-nominal-research-blocks.geojson
          --private-output var/review/estero-vdatum-spatial-samples.json
          --output var/review/estero-2012-vdatum-spatial-diagnostic.json
      - name: Recheck original WGS84 ellipsoid cells and direct VDatum block samples
        run: >-
          python scripts/audit_estero_wgs84_direct.py
          --blocks var/review/estero-nominal-research-blocks.geojson
          --output var/review/estero-wgs84-direct-vdatum-review.json
          --verify dist/data/estero-wgs84-direct-vdatum-review.json
      - name: Check WGS84 source cells against independent 2008 bottom classes
        run: >-
          python scripts/audit_estero_wgs84_2008_character.py
          --blocks var/review/estero-nominal-research-blocks.geojson
          --private-offsets var/review/estero-wgs84-direct-vdatum-blocks.json
          --source-receipt var/review/estero-wgs84-direct-vdatum-review.json
          --output var/review/estero-wgs84-2008-character-sensitivity.json
          --verify dist/data/estero-wgs84-2008-character-sensitivity.json
      - name: Recheck bounded NOAA BAG catalog coverage over Estero research blocks
        run: >-
          python scripts/audit_estero_noaa_bag_catalog_gap.py
          --blocks var/review/estero-nominal-research-blocks.geojson
          --source-receipt var/review/estero-wgs84-direct-vdatum-review.json
          --output var/review/estero-noaa-bag-catalog-gap.json
          --verify dist/data/estero-noaa-bag-catalog-gap.json
      - name: Recheck USGS report release inventory for newly available TPU
        run: >-
          python scripts/audit_estero_release_inventory.py
          --output var/review/estero-2012-public-release-inventory.json
          --verify dist/data/estero-2012-public-release-inventory.json
      - name: Detect changed research-only original cells
        run: |
          cmp dist/data/point-estero-original-paired-200-300ft-review.json var/review/point-estero-original-paired-200-300ft-review.json
          cmp dist/data/usgs-estero-bay-2012-original-200-300ft-review.json var/review/usgs-estero-bay-2012-original-200-300ft-review.json
          cmp dist/data/estero-independent-2012-depth-2008-character-overlap.json var/review/estero-independent-2012-depth-2008-character-overlap.json
          python scripts/check_estero_review_change.py --current var/review/estero-2012-depth-class-closure-block-review.json
          cmp dist/data/csumb-scc-2010-estero-original-block-coverage.json var/review/csumb-scc-2010-estero-original-block-coverage.json
          cmp dist/data/estero-2012-vdatum-spatial-diagnostic.json var/review/estero-2012-vdatum-spatial-diagnostic.json
      - name: Upload research-only source audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: estero-original-200-300ft-research
          path: |
            var/review/point-estero-original-paired-200-300ft-review.json
            var/review/usgs-estero-bay-2012-original-200-300ft-review.json
            var/review/estero-independent-2012-depth-2008-character-overlap.json
            var/review/estero-2012-depth-class-closure-block-review.json
            var/review/estero-original-camera-block-gap.json
            var/review/csumb-scc-2010-estero-original-block-coverage.json
            var/review/estero-cdfw-mpas.geojson
            var/review/estero-federal-areas.geojson
            var/review/enc-hazards-estero-independent-deep-hard.geojson
            var/review/estero-2012-vdatum-frame-review.json
            var/review/estero-2012-vdatum-spatial-diagnostic.json
            var/review/estero-wgs84-direct-vdatum-review.json
            var/review/estero-wgs84-2008-character-sensitivity.json
            var/review/estero-noaa-bag-catalog-gap.json
            var/review/estero-2012-public-release-inventory.json
          retention-days: 30
  point-buchon-original-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned raster readers
        run: python -m pip install numpy==2.2.6 rasterio==1.4.3 pyproj==3.7.1 shapely==2.1.2 pyshp==2.3.1 pypdf==6.10.0
      - name: Verify original pair safeguards
        run: python -m unittest tests.test_point_buchon_original_pair tests.test_point_buchon_2009_csumb_products tests.test_point_buchon_a3_trackline_lineage tests.test_point_buchon_2009_habitat_crosssurvey tests.test_point_buchon_2009_vdatum_probe tests.test_point_buchon_2009_access_blocks tests.test_point_buchon_rov_cell_join tests.test_point_buchon_cmecs_blocks tests.test_point_buchon_noaa_catalog_gap tests.test_point_buchon_bluetopo_overlap tests.test_point_buchon_ncei_multibeam_lead tests.test_point_buchon_ncei_line_index tests.test_point_buchon_ncei_beam_overlap tests.test_point_buchon_caris_prefix tests.test_point_buchon_rov_access_blocks -v
      - name: Recheck original USGS bathymetry and video-supervised character with published ROV
        run: >-
          python scripts/audit_point_buchon_original_pair.py --fetch
          --output var/review/point-buchon-original-paired-200-300ft-review.json
      - name: Recheck 2009 CSUMB Block A3 original grids inside NOAA products archive
        run: >-
          python scripts/audit_point_buchon_2009_csumb_products.py --fetch
          --output var/review/point-buchon-2009-csumb-original-overlap.json
          --verify dist/data/point-buchon-2009-csumb-original-overlap.json
      - name: Compare 2009 CSUMB and 2008 USGS terrain interpretations
        run: >-
          python scripts/audit_point_buchon_2009_habitat_crosssurvey.py
          --output var/review/point-buchon-2009-csumb-terrain-crosssurvey.json
          --verify dist/data/point-buchon-2009-csumb-terrain-crosssurvey.json
      - name: Recheck related Point Buchon datum and legacy original-grid leads
        run: |
          python scripts/audit_point_buchon_datum_leads.py --fetch --output var/review/point-buchon-datum-provenance-leads.json
          cmp dist/data/point-buchon-datum-provenance-leads.json var/review/point-buchon-datum-provenance-leads.json
      - name: Detect change in research-only original pair
        run: cmp dist/data/point-buchon-original-paired-200-300ft-review.json var/review/point-buchon-original-paired-200-300ft-review.json
      - name: Recheck NCEI Point Buchon processed-sounding acquisition lead
        run: >-
          python scripts/audit_point_buchon_ncei_multibeam_lead.py
          --output var/review/point-buchon-2007-ncei-multibeam-lead.json
          --verify dist/data/point-buchon-2007-ncei-multibeam-lead.json
      - name: Recheck every NCEI Point Buchon generated line-depth summary
        run: >-
          python scripts/audit_point_buchon_ncei_line_index.py
          --output var/review/point-buchon-2007-ncei-line-index.json
          --verify dist/data/point-buchon-2007-ncei-line-index.json
      - name: Recheck original valid GSF beams against original USGS hard cells
        run: >-
          python scripts/audit_point_buchon_ncei_beam_overlap.py
          --output var/review/point-buchon-2007-ncei-valid-beam-overlap.json
          --verify dist/data/point-buchon-2007-ncei-valid-beam-overlap.json
      - name: Recheck bounded original CARIS project and error-surface leads
        run: >-
          python scripts/audit_point_buchon_caris_prefix.py
          --output var/review/point-buchon-2007-caris-prefix-lead.json
          --verify dist/data/point-buchon-2007-caris-prefix-lead.json
      - name: Recheck original hard-cell envelope against fresh NOAA BAG catalog
        run: |
          python scripts/audit_point_buchon_noaa_catalog_gap.py --output var/review/point-buchon-noaa-catalog-envelope-gap.json
          cmp dist/data/point-buchon-noaa-catalog-envelope-gap.json var/review/point-buchon-noaa-catalog-envelope-gap.json
      - name: Recheck measured-versus-interpolated BlueTopo contributors at original hard cells
        run: |
          python scripts/audit_point_buchon_bluetopo_overlap.py --fetch --output var/review/point-buchon-bluetopo-hard-cell-overlap.json
          cmp dist/data/point-buchon-bluetopo-hard-cell-overlap.json var/review/point-buchon-bluetopo-hard-cell-overlap.json
      - name: Fetch current Point Buchon MPA, federal and ENC research screens
        run: |
          python -m scripts.collect_point_buchon_mpa_review --output var/review/point-buchon-cdfw-mpas.geojson
          python scripts/collect_noaa_groundfish_areas.py --output var/review/point-buchon-federal-areas.geojson
          python scripts/refresh_enc_hazards.py --scope point-buchon-open-reference-hard-context --output var/review/enc-hazards-point-buchon-open-reference.geojson
      - name: Screen whole 2009 CSUMB / 2008 USGS research blocks with margin
        run: >-
          python scripts/audit_point_buchon_2009_access_blocks.py
          --mpas var/review/point-buchon-cdfw-mpas.geojson
          --federal var/review/point-buchon-federal-areas.geojson
          --enc var/review/enc-hazards-point-buchon-open-reference.geojson
          --private-blocks var/review/point-buchon-2009-csumb-100m-blocks.geojson
          --output var/review/point-buchon-2009-csumb-access-triage.json
          --verify dist/data/point-buchon-2009-csumb-access-triage.json
      - name: Recheck historical ROV against original depth and character cells
        run: >-
          python -m scripts.audit_point_buchon_rov_cell_join --fetch-rov
          --blocks var/review/point-buchon-2009-csumb-100m-blocks.geojson
          --access var/review/point-buchon-2009-csumb-access-triage.json
          --output var/review/point-buchon-rov-original-cell-join.json
          --verify dist/data/point-buchon-rov-original-cell-join.json
      - name: Fetch original USGS Point Buchon CMECS polygons
        run: >-
          curl --fail --location --silent --show-error --retry 2 --max-time 600
          'https://cmgds.marine.usgs.gov/data-releases/media/2022/10.5066-P9KBGELE/58f7e9655c85408db68ce2ca1d8cd560/CMECS_OffshorePointBuchon.zip'
          --output var/review/CMECS_OffshorePointBuchon.zip
      - name: Recheck interpreted bedrock against private research blocks
        run: |
          python scripts/audit_point_buchon_cmecs_blocks.py --archive var/review/CMECS_OffshorePointBuchon.zip --output var/review/point-buchon-cmecs-block-review.json
          cmp dist/data/point-buchon-cmecs-block-review.json var/review/point-buchon-cmecs-block-review.json
      - name: Recheck Block A3 bathymetry acquisition tracklines and NOAA catalog
        run: >-
          python scripts/audit_point_buchon_a3_trackline_lineage.py
          --blocks var/review/point-buchon-2009-csumb-100m-blocks.geojson
          --output var/review/point-buchon-block-a3-trackline-lineage.json
          --verify dist/data/point-buchon-block-a3-trackline-lineage.json
      - name: Probe Point Buchon GEOID03 to MLLW model over actual research blocks
        run: >-
          python scripts/audit_point_buchon_2009_vdatum_probe.py --fetch
          --blocks var/review/point-buchon-2009-csumb-100m-blocks.geojson
          --output var/review/point-buchon-2009-conditional-vdatum-probes.json
          --verify dist/data/point-buchon-2009-conditional-vdatum-probes.json
      - name: Screen whole historical ROV research blocks with margin
        run: >-
          python scripts/audit_point_buchon_rov_access_blocks.py
          --mpas var/review/point-buchon-cdfw-mpas.geojson
          --federal var/review/point-buchon-federal-areas.geojson
          --enc var/review/enc-hazards-point-buchon-open-reference.geojson
          --private-blocks var/review/point-buchon-rov-100m-blocks.geojson
          --output var/review/point-buchon-rov-access-triage.json
      - name: Hold changes to research-only access screen
        run: python scripts/check_point_buchon_rov_access_change.py --current var/review/point-buchon-rov-access-triage.json
      - name: Upload unpublished original-pair review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: point-buchon-original-paired-review
          path: |
            var/review/point-buchon-original-paired-200-300ft-review.json
            var/review/point-buchon-2009-csumb-original-overlap.json
            var/review/point-buchon-2009-csumb-access-triage.json
            var/review/point-buchon-rov-original-cell-join.json
            var/review/point-buchon-cmecs-block-review.json
            var/review/point-buchon-block-a3-trackline-lineage.json
            var/review/point-buchon-2009-conditional-vdatum-probes.json
            var/review/point-buchon-2007-ncei-multibeam-lead.json
            var/review/point-buchon-2007-ncei-line-index.json
            var/review/point-buchon-2007-ncei-valid-beam-overlap.json
            var/review/point-buchon-2007-caris-prefix-lead.json
            var/review/point-buchon-datum-provenance-leads.json
            var/review/point-buchon-noaa-catalog-envelope-gap.json
            var/review/point-buchon-bluetopo-hard-cell-overlap.json
            var/review/point-buchon-cdfw-mpas.geojson
            var/review/point-buchon-federal-areas.geojson
            var/review/enc-hazards-point-buchon-open-reference.geojson
            var/review/point-buchon-rov-access-triage.json
          retention-days: 30
  central-rov-deep-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install spatial join dependencies
        run: python -m pip install pyproj==3.7.1 shapely==2.1.2
      - name: Verify depth and protected-site gates
        run: python -m unittest tests.test_central_rov_depth_evidence -v
      - name: Recheck published ROV object and open-reference summary
        run: >-
          python scripts/build_central_rov_depth_evidence.py --fetch
          --output var/review/central-rov-200-300ft-evidence.json
      - name: Detect changed deeper biological context
        run: cmp dist/data/central-rov-200-300ft-evidence.json var/review/central-rov-200-300ft-evidence.json
      - name: Recheck original ROV subunits against Monterey research outlines
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/audit_monterey_rov_research_overlap.py
          --output var/review/monterey-rov-research-overlap.json
          --verify dist/data/monterey-rov-research-overlap.json
      - name: Verify biological proximity remains research-only
        env:
          PYTHONPATH: src:.
        run: python -m unittest tests.test_monterey_rov_research_overlap -v
      - name: Upload research-only ROV summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: central-rov-200-300ft-evidence
          path: |
            var/review/central-rov-200-300ft-evidence.json
            var/review/monterey-rov-research-overlap.json
          retention-days: 30
  ccfrp-open-reference-context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify bounded public evidence contract
        run: python -m unittest tests.test_ccfrp_area_evidence -v
      - name: Recheck CCFRP release, license, objects and effort
        run: >-
          python scripts/build_ccfrp_area_evidence.py --fetch
          --output var/review/central-ccfrp-area-evidence.json
      - name: Detect changed biological context
        run: cmp dist/data/central-ccfrp-area-evidence.json var/review/central-ccfrp-area-evidence.json
      - name: Upload review-only area evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ccfrp-open-reference-area-evidence
          path: var/review/central-ccfrp-area-evidence.json
          retention-days: 30
  central-300-research-priority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify conservative band overlap handling
        run: python -m unittest tests.test_monterey_300_research_queue -v
      - name: Rebuild unpublished Monterey depth-band priority
        run: >-
          python scripts/build_monterey_300_research_queue.py
          --output var/review/monterey-300-native-research-queue.json
      - name: Detect changed priority against reviewed snapshot

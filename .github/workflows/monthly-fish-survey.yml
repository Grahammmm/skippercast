name: Monthly California fish survey evidence review

on:
  schedule:
    - cron: "19 11 2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ccfrp-open-reference-context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify bounded public evidence contract
        run: python -m unittest tests.test_ccfrp_area_evidence -v
      - name: Recheck CCFRP release, license, objects and effort
        run: >-
          python scripts/build_ccfrp_area_evidence.py --fetch
          --output var/review/central-ccfrp-area-evidence.json
      - name: Detect changed biological context
        run: cmp dist/data/central-ccfrp-area-evidence.json var/review/central-ccfrp-area-evidence.json
      - name: Upload review-only area evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccfrp-open-reference-area-evidence
          path: var/review/central-ccfrp-area-evidence.json
          retention-days: 30
  central-300-research-priority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify conservative band overlap handling
        run: python -m unittest tests.test_monterey_300_research_queue -v
      - name: Rebuild unpublished Monterey depth-band priority
        run: >-
          python scripts/build_monterey_300_research_queue.py
          --output var/review/monterey-300-native-research-queue.json
      - name: Detect changed priority against reviewed snapshot
        run: cmp dist/data/monterey-300-native-research-queue.json var/review/monterey-300-native-research-queue.json
      - name: Upload research-only depth-band review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monterey-300-native-research-priority
          path: var/review/monterey-300-native-research-queue.json
          retention-days: 30
  noaa-vdatum-monterey-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reviewed polygon reader
        run: python -m pip install shapely==2.1.2
      - name: Verify VDatum sentinel handling
        run: python -m unittest tests.test_vdatum_samples -v
      - name: Recheck official NAVD88-to-MLLW point coverage
        run: >-
          python scripts/audit_vdatum_samples.py
          --probe=-121.9,36.6
          --output var/review/noaa-vdatum-offshore-monterey-samples.json
      - name: Upload unpublished datum-service review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noaa-vdatum-monterey-coverage-review
          path: var/review/noaa-vdatum-offshore-monterey-samples.json
          retention-days: 30
  cdfw-crfs-historical-rcgl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify missing-value and block-location handling
        run: python -m unittest tests.test_cdfw_crfs_rcgl -v
      - name: Recheck CDFW source version and every RCGL block
        run: >-
          python scripts/audit_cdfw_crfs_rcgl.py
          --output var/review/cdfw-crfs-rcgl-2004-2024.json
      - name: Upload unpublished CDFW survey review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdfw-crfs-rcgl-review
          path: var/review/cdfw-crfs-rcgl-2004-2024.json
          retention-days: 30
  noaa-dismap-groundfish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify survey aggregation contract
        run: python -m unittest tests.test_noaa_dismap_groundfish -v
      - name: Refresh recent NOAA trawl evidence with schema and count checks
        run: >-
          python scripts/audit_noaa_dismap_groundfish.py
          --output var/review/noaa-dismap-groundfish-2023-2025.json
      - name: Upload unpublished source review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noaa-dismap-groundfish-review
          path: var/review/noaa-dismap-groundfish-2023-2025.json
          retention-days: 30

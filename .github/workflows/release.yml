name: Release

# Creates the GitHub Release for a version tag, using that version's
# CHANGELOG.md section as the notes. See docs/operations/release-process.md.
# Tags that point at commits older than this workflow (for example v0.3.0)
# do not trigger it; publish those with "Run workflow" and the tag name.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.3.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        # Run the parser from the workflow checkout, not the historical tag.
        run: python3 -I scripts/changelog_section.py --tagged -- "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "SkipperCast ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"

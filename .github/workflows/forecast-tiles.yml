name: Forecast tiles

# Manual rebuild of SkipperCast's NOAA/ECMWF forecast tiles. The live-conditions
# loop normally does this every 30 minutes; use this to force a rebuild.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the newest cycle is already published
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forecast-tiles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          # The shared data runner has a 17 GB pip cache; saving it can exceed
          # this job's 45-minute timeout after publication. Keep its local cache
          # and installed tools, but do not upload the whole cache to Actions.
      - name: Install GRIB decoder
        run: python -m pip install -r requirements-ocean.txt -r requirements-publish.txt
      - name: Build and publish tiles
        env:
          # R2-only token when configured (docs/cloudflare.md); the deploy token is the fallback.
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_PUBLISH_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          time bash scripts/publish_forecasts.sh
          cat var/forecast-build.json >> "$GITHUB_STEP_SUMMARY"
      - name: Read the published tiles back like the daily pipeline does
        env:
          PYTHONPATH: src
          # raw.githubusercontent.com caches for a few minutes: retry a bounded number of times.
          READBACK_ATTEMPTS: "8"
          READBACK_DELAY_SECONDS: "60"
          BUILD_REPORT: var/forecast-build.json
        run: |
          python - <<'PY'
          import json, os, pathlib, sys, tempfile, time
          from datetime import datetime, timezone
          from skippercast.forecast import local as forecast_local
          from skippercast.pipeline.collect import model_loader, Client
          from skippercast.util.time import stamp
          points = [("Estero Bay", 35.36, -120.94), ("Point Buchon", 35.24, -120.94)]
          attempts = int(os.environ.get("READBACK_ATTEMPTS", "8"))
          delay = float(os.environ.get("READBACK_DELAY_SECONDS", "60"))
          report = json.load(open(os.environ.get("BUILD_REPORT", "var/forecast-build.json")))["models"]

          def read(model):
              # Fetch the manifest and the sampled tiles ONCE into a staging directory, then
              # sample that same copy: the cycle checked below belongs to the very tiles whose
              # hours are counted. A fresh manifest cached in front of a stale tile is caught here.
              with tempfile.TemporaryDirectory() as staging:
                  root = pathlib.Path(staging)
                  client = Client(datetime.now(timezone.utc))
                  forecast_local._stage(client, [model], [(p[1], p[2]) for p in points], root)
                  tiles = sorted((root / model / "tiles").glob("*.json"))
                  if not tiles:
                      raise ValueError(f"{model}: no sampled tile was published")
                  (root / "index.json").write_text("{}")
                  previous = os.environ.get("SKIPPERCAST_FORECAST_ROOT")
                  os.environ["SKIPPERCAST_FORECAST_ROOT"] = str(root)
                  try:
                      url, load = model_loader(model, points)
                      result = load(client)  # unit and shape checks live in the loader
                  finally:
                      if previous is None:
                          os.environ.pop("SKIPPERCAST_FORECAST_ROOT", None)
                      else:
                          os.environ["SKIPPERCAST_FORECAST_ROOT"] = previous
                  generations = set()
                  for tile in tiles:
                      cycle = json.loads(tile.read_text()).get("cycle")
                      generations.add(stamp(datetime.fromtimestamp(cycle, timezone.utc)) if type(cycle) is int else f"invalid:{cycle!r}")
              hourly = result["points"][0]["hourly"]
              key = "wind_speed_10m" if "wind_speed_10m" in hourly else "wave_height"
              filled = sum(v is not None for v in hourly[key])
              assert filled > 100, f"{model}: only {filled} hours of {key}"
              # One cycle only counts when the manifest AND every sampled tile carry it.
              cycle = result["sample_at"]
              if generations != {cycle}:
                  cycle = f"{cycle} (manifest) with tiles at {', '.join(sorted(generations))}"
              return cycle, filled, len(hourly[key]), key

          # Models this build produced or confirmed must read back at exactly that cycle.
          # A model whose build failed and kept the previous tiles is retained, not fresh:
          # it is shape-checked and reported separately, never relabelled as this build.
          expected, retained, failed = {}, [], []
          for model in ("gfs_global", "ecmwf_ifs025", "ncep_gfswave016", "ecmwf_wam"):
              state = report.get(model) or {"status": "failed", "issue": "absent from build report"}
              if state.get("status") == "ok":
                  expected[model] = state["cycle"]
              elif state.get("kept_previous"):
                  retained.append(model)
              else:
                  failed.append(model)
          pending = dict(expected)
          for attempt in range(1, attempts + 1):
              for model in list(pending):
                  try:
                      cycle, filled, total, key = read(model)
                  except Exception as error:
                      print(f"attempt {attempt}/{attempts} {model}: not readable yet ({error})")
                      continue
                  if cycle == pending[model]:
                      print(f"{model}: this build ({report[model]['state']}) cycle {cycle}, {filled}/{total} hours of {key}")
                      del pending[model]
                  else:
                      print(f"attempt {attempt}/{attempts} {model}: published cycle {cycle}, build expects {pending[model]}")
              if not pending or attempt == attempts:
                  break
              time.sleep(delay)
          bad = False
          for model in retained:
              try:
                  cycle, filled, total, key = read(model)
                  print(f"{model}: RETAINED previous build, cycle {cycle} (not this build), {filled}/{total} hours of {key}")
              except Exception as error:
                  print(f"::error title=Forecast model {model}::retained tiles unreadable: {error}")
                  bad = True
          for model in failed:
              print(f"::error title=Forecast model {model}::build failed with nothing retained")
              bad = True
          for model, cycle in pending.items():
              print(f"::error title=Forecast model {model}::published cycle does not match this build ({cycle})")
              bad = True
          sys.exit(1 if bad else 0)
          PY

name: Forecast tiles

# Manual rebuild of SkipperCast's NOAA/ECMWF forecast tiles. The live-conditions
# loop normally does this every 30 minutes; use this to force a rebuild.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the newest cycle is already published
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forecast-tiles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ocean.txt
      - name: Install GRIB decoder
        run: python -m pip install -r requirements-ocean.txt -r requirements-publish.txt
      - name: Build and publish tiles
        env:
          # R2-only token when configured (docs/cloudflare.md); the deploy token is the fallback.
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_PUBLISH_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          time bash scripts/publish_forecasts.sh
          cat var/forecast-build.json >> "$GITHUB_STEP_SUMMARY"
      - name: Read the published tiles back like the daily pipeline does
        env:
          PYTHONPATH: src
        run: |
          sleep 60  # raw.githubusercontent.com caches for a few minutes
          python - <<'PY'
          from datetime import datetime, timezone
          from skippercast.pipeline.collect import model_loader, Client
          points = [("Estero Bay", 35.36, -120.94), ("Point Buchon", 35.24, -120.94)]
          for model in ("gfs_global", "ecmwf_ifs025", "ncep_gfswave016", "ecmwf_wam"):
              url, load = model_loader(model, points)
              result = load(Client(datetime.now(timezone.utc)))
              hourly = result["points"][0]["hourly"]
              key = "wind_speed_10m" if "wind_speed_10m" in hourly else "wave_height"
              filled = sum(v is not None for v in hourly[key])
              print(f"{model}: cycle {result['sample_at']}, {filled}/{len(hourly[key])} hours of {key}")
              assert filled > 100, model
          PY

name: DCO

# Developer Certificate of Origin: outside contributors must sign off each
# commit (`git commit -s`). The owner (Grahammmm, which includes Codex commits
# authored as the owner) and Claude <noreply@anthropic.com> are exempt on
# branches of this repository; pull requests from forks get no exemptions.
# See CONTRIBUTING.md and docs/engineering/adr/0004-licensing.md.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: Budget drift pull request number
        required: true
        type: string
      head:
        description: Exact head emitted by the budget drift refresh
        required: true
        type: string
  # Merge queue: sign-off is a required check, so it must report on the queued
  # merge commit too. Each pull request already passed sign-off on its own head
  # to enter the queue, and a new push removes it from the queue, so the
  # merge-group run only records that and checks nothing again.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

# One run per pull request; a new push cancels the obsolete one (never main or the merge queue).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sign-off:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge queue group (commits were checked on each pull request)
        if: github.event_name == 'merge_group'
        run: echo "::notice title=DCO::sign-off was checked on each queued pull request's head"
      - name: Resolve the dispatched budget drift pull request
        id: bot-pr
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HEAD: ${{ inputs.head }}
        run: |
          # Dispatch resolves the ref at receipt time, so refuse a moved branch
          # even if the PR API could otherwise supply a valid commit list.
          if [[ "$GITHUB_REF" != refs/heads/bot/budget-drift || ! "$PR" =~ ^[1-9][0-9]*$ ||
                ! "$HEAD" =~ ^[0-9a-f]{40}$ || "$HEAD" != "$GITHUB_SHA" ]]; then
            echo '::error::DCO dispatch does not match the refreshed budget drift ref and head.'
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" | jq -er \
            --arg repo "$GITHUB_REPOSITORY" --arg head "$HEAD" '
              select(.state == "open" and .head.ref == "bot/budget-drift" and .head.sha == $head
                     and .head.repo.full_name == $repo and .head.repo.fork == false
                     and .base.ref == "main" and .base.repo.full_name == $repo
                     and (.base.sha | test("^[0-9a-f]{40}$")) and .commits > 0)
              | "base=\(.base.sha)\ncount=\(.commits)"
            ' >> "$GITHUB_OUTPUT"
      - name: Check Signed-off-by on pull-request commits
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.bot-pr.outputs.base || github.event.pull_request.base.sha }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          HEAD: ${{ inputs.head || github.event.pull_request.head.sha }}
          COUNT: ${{ steps.bot-pr.outputs.count || github.event.pull_request.commits }}
          FORK: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.repo.fork) }}
        run: |
          # No PR checkout or fallback to code from the PR. A missing base checker is red.
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/scripts/check_dco.py?ref=$BASE" > "$RUNNER_TEMP/check_dco.py"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits?per_page=100" > "$RUNNER_TEMP/commits.json"
          # Refuse a truncated response (the endpoint caps at 250) or a newer head.
          if ! jq -e --arg head "$HEAD" --arg count "$COUNT" '
            add | length > 0 and (length | tostring) == $count and .[-1].sha == $head
          ' "$RUNNER_TEMP/commits.json" >/dev/null; then
            echo '::error::The commit list is incomplete or does not match the event head.'
            exit 1
          fi
          if [ "$FORK" = "true" ]; then
            python3 "$RUNNER_TEMP/check_dco.py" --fork "$RUNNER_TEMP/commits.json"
          else
            python3 "$RUNNER_TEMP/check_dco.py" "$RUNNER_TEMP/commits.json"
          fi

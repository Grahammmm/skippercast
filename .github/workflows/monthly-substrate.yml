name: Monthly statewide substrate review

on:
  schedule:
    - cron: "37 10 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bluetopo-source-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned raster reader
        run: python -m pip install -r requirements-survey.txt
      - name: Reuse exact NOAA BlueTopo originals
        uses: actions/cache@v4
        with:
          path: var/bluetopo-cache
          key: bluetopo-statewide-source-${{ hashFiles('catalog/bluetopo-statewide-sample.json') }}
      - name: Recheck measured contributor pixels and publisher scheme
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/refresh_bluetopo_samples.py
          --manifest catalog/bluetopo-statewide-sample.json
          --output var/review/bluetopo-pinned-samples.json
      - name: Upload unpublished BlueTopo source review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluetopo-source-leads
          path: var/review/bluetopo-pinned-samples.json
          retention-days: 30
  usgs-caldig-deepwater:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned native-grid reader
        run: python -m pip install -r requirements-survey.txt
      - name: Verify 200 and 300 foot source exclusions
        env:
          PYTHONPATH: src:.
        run: python -m unittest tests.test_usgs_caldig_v2 -v
      - name: Reuse exact USGS version 2 original archives
        uses: actions/cache@v4
        with:
          path: var/usgs-dig-cache/Cal_DIG_I_v2_*.zip
          key: usgs-caldig-v2-original-${{ hashFiles('catalog/usgs-caldig-v2.json') }}
      - name: Rescan exact original bathymetry and CMECS polygons
        run: >-
          python scripts/audit_usgs_caldig_v2.py
          --fetch
          --output var/review/usgs-caldig-v2-native-review.json
      - name: Upload deepwater source review, not fishing targets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usgs-caldig-v2-source-review
          path: var/review/usgs-caldig-v2-native-review.json
          retention-days: 30
  ncei-survey-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify bounded survey discovery
        env:
          PYTHONPATH: src:.
        run: python -m unittest tests.test_ncei_multibeam_discovery -v
      - name: Discover original multibeam survey leads for all 19 sectors
        run: >-
          python scripts/discover_ncei_multibeam.py
          --output var/review/ncei-multibeam-discovery.json
      - name: Upload unpublished source-lead review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncei-multibeam-discovery
          path: var/review/ncei-multibeam-discovery.json
          retention-days: 30
  csumb-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned native-grid reader
        run: python -m pip install -r requirements-survey.txt
      - name: Verify native-grid receipts stay out of fishing targets
        run: python -m unittest tests.test_csumb_scc_native tests.test_csumb_bss_native -v
      - name: Reuse original CSUMB archives
        uses: actions/cache@v4
        with:
          path: |
            var/noaa-native-cache/SCC_Block*_additional_products.tar.gz
            var/noaa-native-cache/BSS_Block*_additional_products.tar.gz
          key: csumb-scc-bss-original-v1-${{ hashFiles('catalog/csumb-scc-native-sources.json', 'catalog/csumb-bss-native-sources.json') }}
      - name: Audit exact original CSUMB bathymetry and terrain classes
        run: >-
          python scripts/audit_csumb_scc_native.py
          --fetch
          --output var/review/csumb-scc-native-source-review.json
      - name: Screen original USGS geology against measured terrain and fresh CDFW MPAs
        run: >-
          python scripts/audit_sansimeon_bedrock_overlap.py
          --fetch
          --output var/review/csumb-sansimeon-bedrock-overlap-review.json
      - name: Audit exact original Big Sur South bathymetry and terrain classes
        run: >-
          python scripts/audit_csumb_bss_native.py
          --fetch
          --output var/review/csumb-bss-native-source-review.json
      - name: Upload unpublished source review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csumb-scc-native-review
          path: |
            var/review/csumb-scc-native-source-review.json
            var/review/csumb-sansimeon-bedrock-overlap-review.json
            var/review/csumb-bss-native-source-review.json
          retention-days: 30
  audit:
    # pylerc 4.2.0 has a verified macOS universal2 wheel for this adapter.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Load latest public MPA snapshot
        uses: actions/checkout@v4
        with:
          ref: data
          path: var/published
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned geospatial reader
        run: python -m pip install -r requirements-survey.txt
      - name: Reuse verified original-source archives
        uses: actions/cache@v4
        with:
          path: |
            var/nbs-cache
            var/usgs-native-cache
            var/usgs-doi-native-cache
          key: california-original-rasters-v1-${{ hashFiles('catalog/nbs-modeling-sample.json', 'catalog/usgs-seafloor-sources.json') }}
          restore-keys: |
            california-original-rasters-v1-
      - name: Verify substrate adapter and class safeguards
        run: python -m unittest tests.test_cdfw_substrate_pipeline -v
      - name: Audit pinned USGS camera observations statewide
        run: >-
          python scripts/audit_usgs_video_observations.py
          --download-missing
          --output var/review/usgs-video-observation-audit.json
      - name: Check NOAA composite induration against pinned original camera records
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/audit_noaa_induration_camera.py
          --output var/review/noaa-induration-camera-review.json
      - name: Cross-check camera transects against native context
        run: >-
          python scripts/audit_usgs_native_overlap.py
          --output var/review/usgs-video-native-overlap.json
      - name: Check pinned NOAA NBS Modeling scheme and detect a newer version
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/check_nbs_modeling_scheme.py
          --output var/review/nbs-modeling-scheme-health.json
      - name: Screen one original NOAA NBS source tile per browse sector
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/audit_nbs_statewide_camera_tiles.py
          --scheme var/nbs-cache/modeling-tile-scheme.gpkg
          --mpas var/published/latest.json
          --fetch
          --workers 4
          --output var/review/nbs-statewide-camera-tile-review.json
      - name: Expand NOAA NBS source review to three tiles per sector statewide
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/audit_nbs_coast_camera_tiles.py
          --scheme var/nbs-cache/modeling-tile-scheme.gpkg
          --mpas var/published/latest.json
          --coast all
          --max-tiles 3
          --fetch
          --workers 4
          --output var/review/nbs-statewide-multiple-camera-tile-review.json
      - name: Audit every camera-prioritized Monterey and Big Sur tile
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/audit_nbs_coast_camera_tiles.py
          --scheme var/nbs-cache/modeling-tile-scheme.gpkg
          --mpas var/published/latest.json
          --coast central
          --sector-id monterey-sur
          --sector-id big-sur
          --sector-id sur-san-simeon
          --max-tiles 12
          --fetch
          --workers 4
          --output var/review/nbs-central-gap-all-camera-tiles-review.json
      - name: Discover older USGS map-block source links
        run: python scripts/discover_usgs_map_blocks.py --output var/review/usgs-map-blocks.json
      - name: Review older USGS original metadata
        run: >-
          python scripts/audit_usgs_map_metadata.py
          --blocks var/review/usgs-map-blocks.json
          --output var/review/usgs-map-metadata.json
      - name: Inspect older USGS original class rasters
        run: >-
          python scripts/inspect_usgs_native_grids.py
          --blocks var/review/usgs-map-blocks.json
          --metadata var/review/usgs-map-metadata.json
          --cache var/usgs-native-cache
          --output var/review/usgs-native-audit.json
      - name: Discover newer USGS DOI source links
        run: python scripts/discover_usgs_doi_releases.py --output var/review/usgs-doi-releases.json
      - name: Review newer USGS original metadata
        run: >-
          python scripts/audit_usgs_doi_metadata.py
          --releases var/review/usgs-doi-releases.json
          --output var/review/usgs-doi-metadata.json
      - name: Inspect newer USGS original class rasters
        run: >-
          python scripts/inspect_usgs_doi_grids.py
          --releases var/review/usgs-doi-releases.json
          --metadata var/review/usgs-doi-metadata.json
          --cache var/usgs-doi-native-cache
          --output var/review/usgs-doi-native-audit.json
      - name: Queue every reviewed USGS class grid against fine NOAA tiles
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/queue_statewide_original_class_tiles.py
          --audit var/review/usgs-doi-native-audit.json
          --metadata var/review/usgs-doi-metadata.json
          --output var/review/statewide-original-class-fine-tile-queue.json
      - name: Recheck the Pigeon Point to Monterey source gap
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/triage_original_class_tile_queue.py
          --queue var/review/statewide-original-class-fine-tile-queue.json
          --release-id F70Z71C8 --release-id F7513W80 --release-id F7CJ8BJW
          --fetch
          --output var/review/pigeon-monterey-original-class-depth-triage.json
      - name: Recheck Eel River original-class NOAA tile coverage
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/queue_nbs_original_class_tiles.py \
            --release-id P902YIF5 \
            --audit var/review/usgs-doi-native-audit.json \
            --metadata var/review/usgs-doi-metadata.json \
            --output var/review/eel-river-original-class-tile-queue.json
          for tile in BH42J5FK BH42H5FJ BH42H5FH BH42J5FJ; do
            python scripts/audit_nbs_modeling_tile.py \
              --scheme var/nbs-cache/modeling-tile-scheme.gpkg \
              --tile "$tile" --cache var/nbs-cache --fetch \
              --output "var/review/eel-river-${tile}-nbs-audit.json"
          done
          python scripts/screen_original_class_nbs_tiles.py \
            --queue var/review/eel-river-original-class-tile-queue.json \
            --audit var/review/usgs-doi-native-audit.json \
            --metadata var/review/usgs-doi-metadata.json \
            --tile-receipt var/review/eel-river-BH42J5FK-nbs-audit.json \
            --tile-receipt var/review/eel-river-BH42H5FJ-nbs-audit.json \
            --tile-receipt var/review/eel-river-BH42H5FH-nbs-audit.json \
            --tile-receipt var/review/eel-river-BH42J5FJ-nbs-audit.json \
            --output var/review/eel-river-class3-measured-depth-screen.json
      - name: Refresh NOAA federal groundfish exclusions
        run: python scripts/collect_noaa_groundfish_areas.py --output var/review/noaa-federal-areas.json
      - name: Check NOAA coastwide species-habitat source granularity
        run: python scripts/audit_noaa_efh_source.py --output var/review/noaa-efh-source-review.json
      - name: Cross-check original hard class against measured NOAA cells statewide
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/review_nbs_statewide_hard_overlap.py
          --review var/review/nbs-statewide-multiple-camera-tile-review.json
          --scheme var/nbs-cache/modeling-tile-scheme.gpkg
          --usgs-audit var/review/usgs-doi-native-audit.json
          --map-audit var/review/usgs-native-audit.json
          --mpas var/published/latest.json
          --federal var/review/noaa-federal-areas.json
          --output var/review/nbs-statewide-usgs-hard-overlap-review.json
      - name: Check original USGS camera windows inside published measured-depth research outlines
        run: >-
          python scripts/audit_usgs_native_overlap.py
          --context-name northern-nbs-usgs-hard-research-context.geojson
          --context-name san-francisco-nbs-usgs-hard-research-context.geojson
          --context-name central-nbs-usgs-hard-research-context.geojson
          --output var/review/usgs-video-nbs-hard-overlap.json
      - name: Audit every California browse-sector tile
        run: python scripts/audit_cdfw_substrate_tiles.py --workers 8 --output var/review/cdfw-ds3091-tile-audit.json
      - name: Build MPA-screened review layers
        run: >-
          python scripts/build_cdfw_substrate_context.py
          --audit var/review/cdfw-ds3091-tile-audit.json
          --mpas var/published/latest.json
          --output-dir var/review
      - name: Upload source audit and unpublished review layers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdfw-ds3091-review
          path: var/review/
          retention-days: 30

# This workflow deliberately does not change public map files. Camera observations,
# source-class intersections and closures need a reviewed commit before deployment.

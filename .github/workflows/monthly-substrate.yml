          PYTHONPATH: src:.
        run: >-
          python scripts/inventory_nbs_hard_footprint_tiles.py
          --scheme var/nbs-cache/modeling-tile-scheme.gpkg
          --output var/review/nbs-hard-footprint-tile-inventory.json
      - name: Audit the complete displayed-hard NOAA tile inventory
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/audit_nbs_hard_footprint_tiles.py
          --inventory var/review/nbs-hard-footprint-tile-inventory.json
          --scheme var/nbs-cache/modeling-tile-scheme.gpkg
          --fetch --workers 4
          --output var/review/nbs-hard-footprint-depth-audit.json
      - name: Fetch hash-pinned original USGS class archives for the expanded overlap
        run: >-
          python scripts/fetch_hard_footprint_usgs_class.py
          --inventory var/review/nbs-hard-footprint-tile-inventory.json
          --usgs-audit var/review/usgs-doi-native-audit.json
          --map-audit var/review/usgs-native-audit.json
          --output var/review/nbs-hard-footprint-usgs-class-fetch.json
      - name: Join measured NOAA depths to original hard classes outside current closures
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/review_nbs_hard_footprint_overlap.py
          --inventory var/review/nbs-hard-footprint-tile-inventory.json
          --depth var/review/nbs-hard-footprint-depth-audit.json
          --scheme var/nbs-cache/modeling-tile-scheme.gpkg
          --mpas var/published/latest.json
          --federal var/review/noaa-federal-areas.json
          --output var/review/nbs-hard-footprint-original-class-overlap.json
      - name: Check NOAA coastwide species-habitat source granularity
        run: python scripts/audit_noaa_efh_source.py --output var/review/noaa-efh-source-review.json
      - name: Cross-check original hard class against measured NOAA cells statewide
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/review_nbs_statewide_hard_overlap.py
          --review var/review/nbs-statewide-multiple-camera-tile-review.json
          --scheme var/nbs-cache/modeling-tile-scheme.gpkg
          --usgs-audit var/review/usgs-doi-native-audit.json
          --map-audit var/review/usgs-native-audit.json
          --mpas var/published/latest.json
          --federal var/review/noaa-federal-areas.json
          --output var/review/nbs-statewide-usgs-hard-overlap-review.json
      - name: Check original USGS camera windows inside published measured-depth research outlines
        run: >-
          python scripts/audit_usgs_native_overlap.py
          --context-name northern-nbs-usgs-hard-research-context.geojson
          --context-name san-francisco-nbs-usgs-hard-research-context.geojson
          --context-name central-nbs-usgs-hard-research-context.geojson
          --output var/review/usgs-video-nbs-hard-overlap.json
      - name: Audit every California browse-sector tile
        run: python scripts/audit_cdfw_substrate_tiles.py --workers 8 --output var/review/cdfw-ds3091-tile-audit.json
      - name: Fetch original Point Arena USGS camera archives
        run: |
          mkdir -p var/usgs-video-cache
          curl --fail --location --silent --show-error --max-time 120 https://pubs.usgs.gov/ds/781/video_observations/data/f208nc_video_observations.zip --output var/usgs-video-cache/f208nc_video_observations.zip
          curl --fail --location --silent --show-error --max-time 120 https://pubs.usgs.gov/ds/781/video_observations/data/c210nc_video_observations.zip --output var/usgs-video-cache/c210nc_video_observations.zip
      - name: Recheck Point Arena camera windows against CDFW substrate and remote USGS context
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/audit_h11730_cdfw_substrate_overlap.py
          --tile-audit var/review/cdfw-ds3091-tile-audit.json
          --output var/review/h11730-point-arena-cdfw-substrate-crosscheck.json
          --verify dist/data/h11730-point-arena-cdfw-substrate-crosscheck.json
      - name: Build MPA-screened review layers
        run: >-
          python scripts/build_cdfw_substrate_context.py
          --audit var/review/cdfw-ds3091-tile-audit.json
          --mpas var/published/latest.json
          --output-dir var/review
      - name: Upload source audit and unpublished review layers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdfw-ds3091-review
          path: var/review/
          retention-days: 30


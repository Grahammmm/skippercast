name: Monthly statewide substrate review

on:
  schedule:
    - cron: "37 10 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monterey-original-300-source-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned GIS dependencies
        run: python -m pip install -r requirements-survey.txt
      - name: Verify Monterey evidence joins and fail-closed source checks
        env:
          PYTHONPATH: src:.
        run: python -m unittest tests.test_monterey_300_closures tests.test_monterey_300_enc tests.test_monterey_300_review_matrix tests.test_monterey_vdatum_probes tests.test_monterey_noaa_bag_overlap -v
      - name: Verify four original NOAA BAGs still lack measured cells in the 17 Monterey outlines
        env:
          PYTHONPATH: src:.
        run: python scripts/refresh_monterey_noaa_bag_overlap.py
      - name: Recheck NOAA Monterey regional VDatum model package and conditional probes
        env:
          PYTHONPATH: src:.
        run: |
          mkdir -p var/review
          curl --fail --location --silent --show-error --max-time 120 \
            https://www.vdatum.noaa.gov/download/data/CAmontby13_8301.zip \
            --output var/review/CAmontby13_8301.zip
          python scripts/audit_monterey_vdatum_probes.py \
            --archive var/review/CAmontby13_8301.zip \
            --output var/review/monterey-300-conditional-vdatum-probes.json
      - name: Refresh reviewed official protected areas and federal groundfish areas
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/refresh_reviewed_closures.py --region santa-cruz-monterey-bay
          python scripts/refresh_reviewed_closures.py --region monterey-point-sur
          python scripts/collect_noaa_groundfish_areas.py --output var/review/monterey-noaa-federal-areas.json
      - name: Refresh bounded NOAA ENC danger features
        run: python scripts/refresh_enc_hazards.py --scope monterey-original-300-hard-context --output var/review/monterey-enc-dangers.geojson
      - name: Recheck original research outlines and join independent evidence
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/audit_monterey_300_closures.py --federal var/review/monterey-noaa-federal-areas.json --output var/review/monterey-300-closure-review.json
          python scripts/audit_monterey_300_enc.py --enc var/review/monterey-enc-dangers.geojson --output var/review/monterey-300-enc-review.json
          python scripts/build_monterey_300_review_matrix.py --closure var/review/monterey-300-closure-review.json --enc var/review/monterey-300-enc-review.json --output var/review/monterey-300-evidence-matrix.json
      - name: Upload research-only source receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monterey-original-300-source-screen
          path: |
            var/review/monterey-noaa-federal-areas.json
            var/review/monterey-enc-dangers.geojson
            var/review/monterey-300-closure-review.json
            var/review/monterey-300-enc-review.json
            var/review/monterey-300-evidence-matrix.json
            var/review/monterey-300-conditional-vdatum-probes.json
            var/review/monterey-bag-overlap/*-fresh-overlap.json
          retention-days: 30
  central-coverage-and-source-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned native-grid reader
        run: python -m pip install -r requirements-survey.txt
      - name: Recheck original F00844 fifth BAG at Point Arguello
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/audit_central_extra_bag.py --fetch --output var/review/f00844-original-fifth-bag-review.json
          cmp var/review/f00844-original-fifth-bag-review.json dist/data/f00844-original-fifth-bag-review.json
      - name: Recheck original W00614 depth versus USGS Pigeon Point character
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/audit_pigeon_w00614_original_class.py --fetch --output var/review/w00614-pigeon-original-character-overlap.json
          cmp var/review/w00614-pigeon-original-character-overlap.json dist/data/w00614-pigeon-original-character-overlap.json
      - name: Verify Central gap ledger, catalog join and 300 ft qualification holds
        run: python -m unittest tests.test_central_coverage_pipeline tests.test_central_300_qualification_plan tests.test_pigeon_w00614_original_class -v
      - name: Rebuild deterministic Central Coast coverage and source priorities
        run: |
          python scripts/build_central_coverage_ledger.py --output var/review/central-coverage-ledger-v1.json
          python scripts/build_central_source_queue.py --output var/review/central-source-acquisition-queue.json
          python scripts/build_central_300_qualification_plan.py --output var/review/central-300ft-qualification-plan.json
      - name: Hold any unexplained publication drift for review
        run: |
          cmp var/review/central-coverage-ledger-v1.json dist/data/central-coverage-ledger-v1.json
          cmp var/review/central-source-acquisition-queue.json dist/data/central-source-acquisition-queue.json
          cmp var/review/central-300ft-qualification-plan.json dist/data/central-300ft-qualification-plan.json
      - name: Upload source-gap review even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-coast-source-gaps
          path: |
            var/review/f00844-original-fifth-bag-review.json
            var/review/w00614-pigeon-original-character-overlap.json
            var/review/central-coverage-ledger-v1.json
            var/review/central-source-acquisition-queue.json
            var/review/central-300ft-qualification-plan.json
          retention-days: 30
  san-pedro-original-character:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned original-raster audit dependencies
        run: python -m pip install -r requirements-survey.txt
      - name: Verify unreviewed source changes and line interpretation fail closed
        run: python -m unittest tests.test_usgs_ds552_san_pedro tests.test_san_pedro_rca_line tests.test_enc_hazard_refresh -v
      - name: Download original USGS San Pedro character and camera archives
        run: |
          mkdir -p var/review/usgs-ds552
          curl --fail --location --silent --show-error --max-time 120 https://pubs.usgs.gov/ds/552/data/raster/inner_shelf_character_tif.zip --output var/review/usgs-ds552/inner_shelf_character_tif.zip
          curl --fail --location --silent --show-error --max-time 120 https://pubs.usgs.gov/ds/552/data/raster/outer_shelf_character_tif.zip --output var/review/usgs-ds552/outer_shelf_character_tif.zip
          curl --fail --location --silent --show-error --max-time 120 https://pubs.usgs.gov/ds/552/data/shp_files/videodes_shp.zip --output var/review/usgs-ds552/videodes_shp.zip
      - name: Download original USGS MLLW depth companion grids
        run: |
          mkdir -p var/review/usgs-of2004-1221
          curl --fail --location --silent --show-error --max-time 120 https://pubs.usgs.gov/of/2004/1221/data/grid/pvebat.tgz --output var/review/usgs-of2004-1221/pvebat.tgz
          curl --fail --location --silent --show-error --max-time 120 https://pubs.usgs.gov/of/2004/1221/data/grid/gabbat.tgz --output var/review/usgs-of2004-1221/gabbat.tgz
          curl --fail --location --silent --show-error --max-time 120 https://pubs.usgs.gov/of/2004/1221/data/grid/spbbat.tgz --output var/review/usgs-of2004-1221/spbbat.tgz
      - name: Audit source bytes, camera overlap and full original-rock MLLW depth
        run: python scripts/audit_usgs_ds552_san_pedro.py --cache var/review/usgs-ds552 --depth-cache var/review/usgs-of2004-1221 --output var/review/usgs-ds552-san-pedro-review.json
      - name: Build unpublished exact original-rock outlines for legal review
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/build_san_pedro_research_context.py
          --audit var/review/usgs-ds552-san-pedro-review.json
          --cache var/review/usgs-ds552
          --context var/review/san-pedro-rock-context.geojson
          --queue var/review/san-pedro-rock-queue.json
      - name: Refresh official statewide MPA and federal-area geometries
        env:
          PYTHONPATH: src:.
        run: |
          python -m skippercast.pipeline.coastal_watch --output var/review/san-pedro-current
          python scripts/collect_noaa_groundfish_areas.py --output var/review/san-pedro-current/noaa-federal-areas.json
      - name: Recheck original rock outlines against fresh closures
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/audit_habitat_shortlist_closures.py
          --queue var/review/san-pedro-rock-queue.json
          --context var/review/san-pedro-rock-context.geojson
          --context-scope usgs-ds552-san-pedro-rock-context
          --projected-crs EPSG:32611
          --coastal var/review/san-pedro-current/coastal/latest.json
          --federal var/review/san-pedro-current/noaa-federal-areas.json
          --output var/review/san-pedro-fresh-closure-audit.json
      - name: Refresh bounded NOAA ENC danger features around San Pedro outlines
        run: >-
          python scripts/refresh_enc_hazards.py
          --scope san-pedro-ds552-original-rock
          --output var/review/san-pedro-enc-hazards.geojson
      - name: Hold outlines near current charted danger features
        run: >-
          python scripts/audit_enc_context_overlap.py
          --enc var/review/san-pedro-enc-hazards.geojson
          --context var/review/san-pedro-rock-context.geojson
          --projected-crs EPSG:32611
          --output var/review/san-pedro-enc-context-review.json
      - name: Download current official NOAA depth-boundary coordinates
        run: >-
          curl --fail --location --silent --show-error --max-time 120
          https://www.fisheries.noaa.gov/s3/2026-09/rca-lines-latlongs-august-2026.zip
          --output var/review/rca-lines-latlongs-august-2026.zip
      - name: Screen exact rock outlines against reviewed 50-fathom RCA coordinate line
        run: >-
          python scripts/audit_san_pedro_rca_line.py
          --archive var/review/rca-lines-latlongs-august-2026.zip
          --context var/review/san-pedro-rock-context.geojson
          --output var/review/san-pedro-rca-screen.json
      - name: Upload unpublished source-change and candidate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usgs-ds552-san-pedro-review
          path: |
            var/review/usgs-ds552-san-pedro-review.json
            var/review/san-pedro-fresh-closure-audit.json
            var/review/san-pedro-enc-context-review.json
            var/review/san-pedro-rca-screen.json
          retention-days: 30
  usgs-state-waters-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify USGS map-area and source-link parser
        run: python -m unittest tests.test_usgs_ds781_catalogs tests.test_usgs_ds781_metadata -v
      - name: Recheck official USGS DS 781 index and linked original products
        run: >-
          python scripts/discover_usgs_ds781_catalogs.py
          --output var/review/usgs-ds781-source-leads.json
          --verify catalog/usgs-ds781-source-leads.json
      - name: Upload unpublished catalog-change receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usgs-ds781-source-leads
          path: var/review/usgs-ds781-source-leads.json
          retention-days: 30
      - name: Recheck original bathymetry and seafloor-character FGDC metadata
        run: >-
          python scripts/audit_usgs_ds781_metadata.py
          --inventory catalog/usgs-ds781-source-leads.json
          --output var/review/usgs-ds781-metadata-review.json
          --verify catalog/usgs-ds781-metadata-review.json
      - name: Upload unpublished FGDC metadata-change receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usgs-ds781-fgdc-metadata
          path: var/review/usgs-ds781-metadata-review.json
          retention-days: 30
  nos-historical-seabed-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify statewide historical-sample audit safeguards
        run: python -m unittest tests.test_noaa_seabed_samples tests.test_noaa_seabed_native_overlap -v
      - name: Recheck complete original NOAA seabed sample pages
        run: >-
          python scripts/audit_noaa_seabed_samples.py
          --baseline dist/data/noaa-seabed-samples-sector-review.json
          --output var/review/noaa-seabed-samples-sector-review.json
      - name: Upload aggregate source-change receipt without original point locations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nos-historical-seabed-samples
          path: var/review/noaa-seabed-samples-sector-review.json
          retention-days: 30
  reefcheck-historical-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify historical observation audit contract
        run: python -m unittest tests.test_reefcheck_observations -v
      - name: Check latest NOAA IOOS / Reef Check Darwin Core archive against reviewed bytes
        run: |
          mkdir -p var/review/reefcheck
          curl --fail --location --silent --show-error --max-time 120 \
            'https://ipt-obis.gbif.us/archive.do?r=rcca_transects' \
            --output var/review/reefcheck/dwca-rcca_transects-v1.5.zip
      - name: Recheck table integrity and broad-sector historical evidence
        run: >-
          python scripts/audit_reefcheck_observations.py
          --archive var/review/reefcheck/dwca-rcca_transects-v1.5.zip
          --output var/review/reefcheck/statewide-observation-audit.json
      - name: Upload unpublished observation review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reefcheck-historical-observations
          path: var/review/reefcheck/statewide-observation-audit.json
          retention-days: 30
  original-hard-context-enc-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned geometry dependencies
        run: python -m pip install -r requirements-survey.txt
      - name: Verify research-only ENC outputs stay unpublished
        env:
          PYTHONPATH: src:.
        run: python -m unittest tests.test_enc_hazard_refresh tests.test_habitat_shortlist_closures tests.test_regular_habitat_triage tests.test_regular_shortlist_terrain -v
      - name: Refresh bounded Cape Mendocino, Point Conception and Gaviota chart-danger screens
        run: |
          python scripts/refresh_enc_hazards.py --scope cape-mendocino-hard-context --output var/review/enc-hazards-cape-mendocino.geojson
          python scripts/refresh_enc_hazards.py --scope point-conception-hard-context --output var/review/enc-hazards-point-conception.geojson
          python scripts/refresh_enc_hazards.py --scope gaviota-hard-context --output var/review/enc-hazards-gaviota.geojson
      - name: Compare research outlines to fresh charted-danger geometry
        run: |
          python scripts/audit_enc_context_overlap.py --enc var/review/enc-hazards-cape-mendocino.geojson --context dist/data/cape-mendocino-native-hard-context.geojson --output var/review/cape-mendocino-enc-context-review.json
          python scripts/audit_enc_context_overlap.py --enc var/review/enc-hazards-point-conception.geojson --context dist/data/point-conception-native-hard-context.geojson --output var/review/point-conception-enc-context-review.json
          python scripts/audit_enc_context_overlap.py --enc var/review/enc-hazards-gaviota.geojson --context dist/data/gaviota-native-hard-context.geojson --output var/review/gaviota-enc-context-review.json
      - name: Rebuild unpublished Cape Mendocino original-habitat site-review queue
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/triage_original_habitat_outlines.py
          --enc var/review/cape-mendocino-enc-context-review.json
          --output var/review/cape-mendocino-original-habitat-site-review-queue.json
      - name: Rebuild unpublished Point Conception and Gaviota original-cell site-review queues
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/triage_regular_habitat_outlines.py \
            --context dist/data/point-conception-native-hard-context.geojson \
            --summary dist/data/point-conception-native-hard-review-summary.json \
            --enc var/review/point-conception-enc-context-review.json \
            --profile-id point-conception-original-regular-bag \
            --output var/review/point-conception-regular-site-review-queue.json
          python scripts/triage_regular_habitat_outlines.py \
            --context dist/data/gaviota-native-hard-context.geojson \
            --summary dist/data/gaviota-native-hard-review-summary.json \
            --enc var/review/gaviota-enc-context-review.json \
            --profile-id gaviota-original-regular-bag \
            --output var/review/gaviota-regular-site-review-queue.json
      - name: Recheck shortlisted outlines against fresh complete CDFW MPAs and NOAA GEAs
        env:
          PYTHONPATH: src:.
        run: |
          python -m skippercast.pipeline.coastal_watch --output var/review/cape-current
          python scripts/collect_noaa_groundfish_areas.py --output var/review/cape-current/noaa-federal-areas.json
          python scripts/audit_habitat_shortlist_closures.py \
            --queue var/review/cape-mendocino-original-habitat-site-review-queue.json \
            --coastal var/review/cape-current/coastal/latest.json \
            --federal var/review/cape-current/noaa-federal-areas.json \
            --output var/review/cape-mendocino-fresh-closure-audit.json
          python scripts/audit_habitat_shortlist_closures.py \
            --queue var/review/point-conception-regular-site-review-queue.json \
            --context dist/data/point-conception-native-hard-context.geojson \
            --context-scope central-native-noaa-usgs-hard-bottom-context \
            --coastal var/review/cape-current/coastal/latest.json \
            --federal var/review/cape-current/noaa-federal-areas.json \
            --output var/review/point-conception-fresh-closure-audit.json
          python scripts/audit_habitat_shortlist_closures.py \
            --queue var/review/gaviota-regular-site-review-queue.json \
            --context dist/data/gaviota-native-hard-context.geojson \
            --context-scope southern-native-noaa-usgs-hard-bottom-context \
            --coastal var/review/cape-current/coastal/latest.json \
            --federal var/review/cape-current/noaa-federal-areas.json \
            --output var/review/gaviota-fresh-closure-audit.json
      - name: Measure Point Conception original-BAG terrain in the closure-screened shortlist
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/fetch_shortlist_original_bags.py \
            --queue var/review/point-conception-regular-site-review-queue.json \
            --context dist/data/point-conception-native-hard-context.geojson
          python scripts/audit_regular_shortlist_terrain.py \
            --queue var/review/point-conception-regular-site-review-queue.json \
            --context dist/data/point-conception-native-hard-context.geojson \
            --closures var/review/point-conception-fresh-closure-audit.json \
            --output var/review/point-conception-shortlist-terrain-review.json
      - name: Refresh all three Bodega original-rock chart-danger scopes
        run: |
          python scripts/refresh_enc_hazards.py --scope point-reyes-tomales --output var/review/point-reyes-tomales-enc-current.geojson
          python scripts/refresh_enc_hazards.py --scope bodega-original-north --output var/review/bodega-original-north-enc.geojson
          python scripts/refresh_enc_hazards.py --scope reyes-original-south --output var/review/reyes-original-south-enc.geojson
      - name: Refresh Point Arena–northern Sonoma original-rock chart-danger scope
        run: >-
          python scripts/refresh_enc_hazards.py
          --scope h11732-h11733-fort-ross-salt-point-context
          --output var/review/enc-hazards-h11732-h11733-fort-ross-salt-point.geojson
      - name: Compare Point Arena–northern Sonoma historical outlines to current ENC dangers
        run: >-
          python scripts/audit_enc_context_overlap.py
          --enc var/review/enc-hazards-h11732-h11733-fort-ross-salt-point.geojson
          --context dist/data/sf-native-hard-context.geojson
          --output var/review/arena-bodega-enc-context-review.json
      - name: Recheck the held Bolinas original-rock fragments against NOAA ENC
        run: |
          python scripts/refresh_enc_hazards.py --scope h12111-bolinas-native-hard-context --output var/review/enc-hazards-h12111-bolinas-native-hard.geojson
          python scripts/audit_enc_context_overlap.py --enc var/review/enc-hazards-h12111-bolinas-native-hard.geojson --context dist/data/sf-native-hard-context.geojson --output var/review/bolinas-enc-context-review.json
          python -c 'import json; p=json.load(open("var/review/bolinas-enc-context-review.json")); assert p["context_outlines_in_scope_by_survey"] == {"H12111": 3}'
      - name: Recheck all 74 original-grid Bodega research outlines
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/audit_bodega_native_enc_scope.py
          --output var/review/bodega-native-enc-scope-review.json
      - name: Upload unpublished chart-danger research receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-hard-context-enc-review
          path: |
            var/review/enc-hazards-cape-mendocino.geojson
            var/review/enc-hazards-point-conception.geojson
            var/review/enc-hazards-gaviota.geojson
            var/review/cape-mendocino-enc-context-review.json
            var/review/cape-mendocino-original-habitat-site-review-queue.json
            var/review/cape-mendocino-fresh-closure-audit.json
            var/review/point-conception-regular-site-review-queue.json
            var/review/point-conception-fresh-closure-audit.json
            var/review/point-conception-shortlist-terrain-review.json
            var/review/gaviota-regular-site-review-queue.json
            var/review/gaviota-fresh-closure-audit.json
            var/review/point-conception-enc-context-review.json
            var/review/gaviota-enc-context-review.json
            var/review/point-reyes-tomales-enc-current.geojson
            var/review/bodega-original-north-enc.geojson
            var/review/reyes-original-south-enc.geojson
            var/review/bodega-native-enc-scope-review.json
            var/review/enc-hazards-h11732-h11733-fort-ross-salt-point.geojson
            var/review/arena-bodega-enc-context-review.json
            var/review/enc-hazards-h12111-bolinas-native-hard.geojson
            var/review/bolinas-enc-context-review.json
          retention-days: 30
  bluetopo-source-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned raster reader
        run: python -m pip install -r requirements-survey.txt
      - name: Reuse exact NOAA BlueTopo originals
        uses: actions/cache@v4
        with:
          path: var/bluetopo-cache
          key: bluetopo-statewide-source-${{ hashFiles('catalog/bluetopo-statewide-sample.json') }}
      - name: Recheck measured contributor pixels and publisher scheme
        env:
          PYTHONPATH: src:.
        run: >-
          python scripts/refresh_bluetopo_samples.py

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skippercast"
version = "0.3.0"
description = "A regional boat-fishing platform with surveyed habitat, ocean forecasts and explicit data provenance."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SkipperCast contributors" }]
dependencies = []

# Optional extras mirror the pinned requirements-*.txt files exactly (tests/contract/test_packaging.py
# fails when they drift). The core app and scheduled live feed need none of them.
[project.optional-dependencies]
# Scheduled ocean collectors: NetCDF/GRIB decoders (requirements-ocean.txt).
ocean = ["numpy==2.5.3", "netCDF4==1.7.4", "scipy==1.17.1", "eccodes==2.49.0"]
# Daily NOAA SST subset parser (requirements-sst.txt).
sst = ["numpy==2.5.3", "scipy==1.17.1"]
# Original-survey and seafloor geometry (requirements-survey.txt); Python 3.12+ in CI.
survey = [
    "numpy==2.5.3",
    "scipy==1.17.1",
    "rasterio==1.5.1",
    "shapely==2.1.2",
    "pyproj==3.8.0",
    "h5py==3.16.0",
    "affine==3.0.1",
    "pylerc==4.2.0",
    "pyshp==3.1.6",
    "pypdf==6.19.0",
    "laspy[lazrs]==2.7.0",
    "lazrs==0.8.2",
]
# Publishing feeds to Cloudflare R2 (requirements-publish.txt). jsonschema turns on
# validate-on-write, so a feed that does not match schemas/ is never published.
publish = ["boto3==1.43.108", "jsonschema==4.26.0"]
# Test runner, JSON Schema validation for seafloor manifests and schemas/, and the
# in-memory S3 used by the R2 publisher test (requirements-test.txt).
test = ["jsonschema==4.26.0", "pytest==9.1.1", "moto==5.2.3", "zstandard==0.25.0"]
# Scheduled seafloor ingestion and publication (requirements-seafloor.txt).
seafloor = ["skippercast[survey,publish,test]"]
# Operating-system trust store for skippercast.http (optional; stdlib TLS otherwise).
tls = ["truststore==0.10.4"]
# Text Advisor media runner job (scripts/advisor/media_job.py, .github/workflows/advisor-media.yml):
# image decoding and drawing, HEIC through pillow-heif. No requirements file: the workflow installs the extra.
advisor = ["Pillow==12.3.0", "pillow-heif==1.8.0"]
# Charter fleet pipeline (python -m skippercast.fleet): region and profile validation, and the
# Zstandard decoder for the MarineCadastre AIS backfill. No requirements file: the fleet workflows install the extra.
fleet = ["jsonschema==4.26.0", "zstandard==0.25.0"]
# Everything a contributor needs to run the full suite and every job locally.
dev = ["skippercast[ocean,survey,publish,test,tls,advisor]", "ruff==0.16.10"]

[project.scripts]
skippercast = "skippercast.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# Lint gate: syntax errors and undefined names only, so it passes on today's code.
# Style rules (format, imports, E/W) are added later, one reviewed step at a time.
[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

# Python tests: docs/engineering/testing.md. Layers are directories; markers are
# applied by tests/conftest.py and research/tests/conftest.py from the directory,
# so a test never needs to declare them. `pythonpath` puts the repository root on
# sys.path (for `tests`, `research` and product `scripts`); the skippercast package
# itself comes from `pip install -e .`. Tests never edit sys.path.
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests", "research/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "-ra"]
xfail_strict = true
markers = [
    "gis: needs the survey stack (pip install -e '.[survey]'); every test under a gis/ directory",
    "claims: pins a statement to committed research receipts or outputs; every test under research/tests/",
    "network: reaches the network; skipped unless SKIPPERCAST_NETWORK=1 (CI is offline)",
]

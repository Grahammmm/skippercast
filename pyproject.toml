[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skippercast"
version = "0.3.0"
description = "A regional boat-fishing platform with surveyed habitat, ocean forecasts and explicit data provenance."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SkipperCast contributors" }]
dependencies = []

# Optional extras mirror the pinned requirements-*.txt files exactly (tests/test_packaging.py
# fails when they drift). The core app and scheduled live feed need none of them.
[project.optional-dependencies]
# Scheduled ocean collectors: NetCDF/GRIB decoders (requirements-ocean.txt).
ocean = ["numpy==2.5.3", "netCDF4==1.7.4", "scipy==1.17.1", "eccodes==2.48.0"]
# Daily NOAA SST subset parser (requirements-sst.txt).
sst = ["numpy==2.5.3", "scipy==1.17.1"]
# Original-survey and seafloor geometry (requirements-survey.txt); Python 3.12+ in CI.
survey = [
    "numpy==2.5.3",
    "scipy==1.17.1",
    "rasterio==1.5.1",
    "shapely==2.1.2",
    "pyproj==3.8.0",
    "h5py==3.16.0",
    "affine==3.0.1",
    "pylerc==4.2.0",
    "pyshp==3.1.6",
    "pypdf==6.19.0",
    "laspy[lazrs]==2.7.0",
    "lazrs==0.8.2",
]
# Publishing feeds to Cloudflare R2 (requirements-publish.txt). jsonschema turns on
# validate-on-write, so a feed that does not match schemas/ is never published.
publish = ["boto3==1.43.103", "jsonschema==4.26.0"]
# JSON Schema validation for seafloor manifests and schemas/ (requirements-test.txt).
test = ["jsonschema==4.26.0"]
# Scheduled seafloor ingestion and publication (requirements-seafloor.txt).
seafloor = ["skippercast[survey,publish,test]"]
# Everything a contributor needs to run the full suite and every job locally.
dev = ["skippercast[ocean,survey,publish,test]", "ruff==0.16.9"]

[project.scripts]
skippercast = "skippercast.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# Lint gate: syntax errors and undefined names only, so it passes on today's code.
# Style rules (format, imports, E/W) are added later, one reviewed step at a time.
[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- noindex: with no area in the address the app replaces itself with the saved home or the landing (web/app/main.tsx), so a crawler sees /map as a redirect to /. -->
    <meta name="robots" content="noindex" />
    <meta name="description" content="Wind, swell, tide and water temperature for the Central California coast on one map, beside the seafloor, habitat candidates and protected areas." />
    <title>SkipperCast · Map</title>
    <!-- The web manifest, theme colour (v1's; design.md names none) and icons that v1's dist/index.html carried until FE-61 (tests/test_v2_head.mjs). -->
    <meta name="theme-color" content="#082e3b" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23082e3b'/%3E%3Cpath d='m20 5 7 24-7-4-7 4z' fill='%2354dacb'/%3E%3Cpath d='M8 33h24' stroke='white' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- FE-05: the v2 shell loads the v2 tokens (web/tokens.css), the primitives and its own sheet, in this order; web/app/main.tsx renders into #app. -->
    <link rel="stylesheet" href="../web/tokens.css" />
    <link rel="stylesheet" href="../web/ui/ui.css" />
    <link rel="stylesheet" href="../web/app/app.css" />
    <link rel="stylesheet" href="../web/landing/port-input.css" />
    <!-- FE-50: the account menu's passkey, boat and alert dialogs (v1 markup from dist/account.js and boat-profile.js; the alerts are web/app/TripAlerts.tsx) in the tokens. -->
    <link rel="stylesheet" href="../web/app/account.css" />
    <!-- FE-51: the trip planner (web/app/Planner.tsx) and the offline section in the tokens. -->
    <link rel="stylesheet" href="../web/app/trip.css" />
    <script src="vendor/simplewebauthn-browser-14.0.0/index.umd.min.js" integrity="sha256-KbsGmbRbw5o1DZkqE7/BpNQNiVMTkFgeH1fxFCxuIh0=" defer></script>
  </head>
  <body>
    <div id="app">
      <main>
        <h1>SkipperCast</h1>
        <p>Loading the map shell.</p>
      </main>
    </div>
    <script type="module" src="../web/app/main.tsx"></script>
  </body>
</html>

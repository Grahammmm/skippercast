<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Your data · SkipperCast</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="advisor/upload.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23082e3b'/%3E%3Cpath d='m20 5 7 24-7-4-7 4z' fill='%2354dacb'/%3E%3C/svg%3E"
    />
  </head>
  <body class="upload-page">
    <!-- "Send me my data" (hardening): served at /my-data by server/routes/advisor.ts; the token is the #fragment and is POSTed in a header. Every string comes from web/advisor/copy.ts. -->
    <main class="upload-card">
      <p class="upload-brand">⌁ SkipperCast</p>
      <h1 id="data-heading"></h1>
      <p id="data-intro" class="upload-intro"></p>
      <button id="data-download" type="button" class="upload-send"></button>
      <p id="data-status" class="upload-status" role="status" hidden></p>
    </main>
    <script type="module" src="advisor/my-data.js"></script>
  </body>
</html>

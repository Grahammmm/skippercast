<!DOCTYPE html>
<!-- Synthetic stand-in for the PSIX export search form (PSIXExportSearch.aspx): the same field names, few options. -->
<html><head><title>CGMIX PSIX Export</title></head>
<body>
<form name="form1" method="post" action="./PSIXExportSearch.aspx" id="form1">
<input type="hidden" name="__VIEWSTATE" id="__VIEWSTATE" value="SYNTHETIC-VIEWSTATE-1" />
<input type="hidden" name="__VIEWSTATEGENERATOR" id="__VIEWSTATEGENERATOR" value="00000000" />
<input type="hidden" name="__EVENTVALIDATION" id="__EVENTVALIDATION" value="SYNTHETIC-VALIDATION-1" />
<select name="DropDownListOriginalDistrict" id="DropDownListOriginalDistrict">
  <option selected="selected" value="ALL">ALL</option>
  <option value="11">USCG Southwest District (CGD-SW)</option>
</select>
<select name="DropDownListOriginalUnit" id="DropDownListOriginalUnit">
  <option selected="selected" value="ALL">ALL</option>
  <option value="4000210">Sector Los Angeles/Long Beach</option>
  <option value="4000100">Sector San Diego</option>
  <option value="3934103">Station San Diego</option>
</select>
<select name="DropDownListVesselType" id="DropDownListVesselType">
  <option selected="selected" value="ALL">ALL</option>
  <option value="20">Passenger (Inspected)</option>
  <option value="8">Passenger (Uninspected)</option>
</select>
<input id="RadioButtonPortStateControl_0" type="radio" name="RadioButtonPortStateControl" value="1" />
<input id="RadioButtonPortStateControl_2" type="radio" name="RadioButtonPortStateControl" value="3" checked="checked" />
<input name="TextBoxFromDate" type="text" id="TextBoxFromDate" />
<input name="TextBoxToDate" type="text" id="TextBoxToDate" />
<input type="submit" name="ButtonSearch" value="Search" id="ButtonSearch" />
<input type="submit" name="ButtonReset" value="Reset" id="ButtonReset" />
</form>
</body></html>
